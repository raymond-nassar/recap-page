import groovy.json.JsonSlurper

plugins {
    id 'com.android.application'
}

abstract class PrepareAndroidAssets extends Exec {
    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()
}

abstract class PrepareAndroidIcon extends Copy {
    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()
}

def repositoryRoot = rootProject.projectDir.toPath().resolve('../..').normalize().toFile()
def buildMetadata = new JsonSlurper().parseText(providers.exec {
    workingDir repositoryRoot
    commandLine 'node', 'scripts/android-release.mjs', 'version'
}.standardOutput.asText.get())
def nativeTestBuildType = providers.gradleProperty('recapAndroidTestBuildType').getOrElse('debug')
if (!(nativeTestBuildType in ['debug', 'release'])) {
    throw new GradleException('recapAndroidTestBuildType must be debug or release')
}
def nativeTestTarget = nativeTestBuildType == 'release' ?
    'io.github.raymondnassar.recappage' : 'io.github.raymondnassar.recappage.prototype'
// Cloud backup is in a build only when it is handed the client configuration and the signature hash of the
// redirect registered for the build type, as -PrecapCloudClientConfig=<path> and
// -PrecapCloudRedirectHashDebug=<hash> or -PrecapCloudRedirectHashRelease=<hash>. Neither is committed
// (OD-06). The hash is the registered string, never read from the signer, so a Play-signed install and a test
// copy built here each sign in at their own registered redirect (OD-07). Without them a build is unchanged.
def cloudConfigPath = providers.gradleProperty('recapCloudClientConfig').orNull
def cloudHashArguments = ['debug', 'release'].collectMany {
    def key = "recapCloudRedirectHash${it.capitalize()}"
    def value = providers.gradleProperty(key).orNull
    def file = providers.gradleProperty("${key}File").orNull
    if (value != null && file != null) {
        throw new GradleException('Give each cloud redirect as a value or a file, not both')
    }
    file != null ? ["${it}-file=${new File(file).absolutePath}".toString()] :
        value != null ? ["${it}=${value}".toString()] : []
}
if (cloudConfigPath == null && !cloudHashArguments.isEmpty()) {
    throw new GradleException('A cloud redirect hash needs recapCloudClientConfig too')
}
def cloudClient = cloudConfigPath == null ? null : new JsonSlurper().parseText(providers.exec {
    workingDir repositoryRoot
    commandLine(['node', 'scripts/android-cloud-client.mjs', new File(cloudConfigPath).absolutePath] + cloudHashArguments)
}.standardOutput.asText.get())

android {
    enableKotlin = false
    namespace 'io.github.raymondnassar.recappage.prototype'
    compileSdk 36
    testBuildType nativeTestBuildType

    defaultConfig {
        applicationId 'io.github.raymondnassar.recappage'
        minSdk 26
        targetSdk 36
        versionCode buildMetadata.versionCode
        versionName buildMetadata.versionName
        testApplicationId "${nativeTestTarget}.test"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        manifestPlaceholders = [
            recapTestTargetPackage: nativeTestTarget,
            recapTestProviderAuthority: "${nativeTestTarget}.test.documents",
        ]
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug {
            applicationIdSuffix '.prototype'
            debuggable true
        }
        release {
            debuggable false
            minifyEnabled false
            shrinkResources false
        }
    }
    lint {
        abortOnError true
        warningsAsErrors true
        // The prototype deliberately pins the reviewed AGP/Gradle compatibility pair.
        disable 'AndroidGradlePluginVersion'
    }
}

dependencies {
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.7.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.4.0'
}

def prepareAssets = tasks.register('prepareAndroidAssets', PrepareAndroidAssets) {
    outputDirectory.set(layout.buildDirectory.dir('generated/assets'))
    workingDir repositoryRoot
    commandLine 'node', new File(repositoryRoot, 'scripts/prepare-android.mjs').absolutePath
    inputs.dir new File(repositoryRoot, 'src')
    inputs.dir new File(rootProject.projectDir, 'web')
    inputs.files new File(repositoryRoot, 'scripts/prepare-android.mjs'),
        new File(repositoryRoot, 'scripts/lib/release-identity.mjs'),
        new File(repositoryRoot, 'scripts/android-release.mjs'),
        new File(repositoryRoot, 'server.mjs'), new File(repositoryRoot, 'package.json')
    inputs.property 'buildIdentity', groovy.json.JsonOutput.toJson(buildMetadata.identity)
}

def prepareIcon = tasks.register('prepareAndroidIcon', PrepareAndroidIcon) {
    outputDirectory.set(layout.buildDirectory.dir('generated/recap-res'))
    from new File(repositoryRoot, 'src/icons/icon-192.png')
    into outputDirectory.dir('drawable-nodpi')
    rename { 'recap_icon.png' }
}

androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    variant.sources.assets.addGeneratedSourceDirectory(prepareAssets) { it.outputDirectory }
    variant.sources.res.addGeneratedSourceDirectory(prepareIcon) { it.outputDirectory }
    def cloudHash = cloudClient?.redirectHashes?.get(variant.buildType)
    if (cloudHash != null) {
        variant.sources.manifests.addStaticManifestFile('src/cloud/AndroidManifest.xml')
        variant.manifestPlaceholders.put('recapCloudClient', cloudClient.clientId)
        variant.manifestPlaceholders.put('recapCloudRedirectHash', cloudHash)
    }
}

// No JUnit dependency is needed for the platform-independent navigation boundary.
tasks.register('compilePolicyTests', JavaCompile) {
    source 'src/main/java/io/github/raymondnassar/recappage/prototype/NavigationPolicy.java',
        'src/test/java/io/github/raymondnassar/recappage/prototype/NavigationPolicyTest.java'
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir('policy-tests')
    sourceCompatibility = '17'
    targetCompatibility = '17'
}
tasks.register('policyTest', JavaExec) {
    dependsOn 'compilePolicyTests'
    classpath = files(layout.buildDirectory.dir('policy-tests'))
    mainClass = 'io.github.raymondnassar.recappage.prototype.NavigationPolicyTest'
}
// The cloud account and its OneDrive client are plain Java behind small interfaces, so the sign-in, token
// and request rules run here on a JVM against a scripted network, with no device and no test library. The
// Android adapters around them are named without the Cloud prefix so they stay out of this compile.
tasks.register('compileCloudTests', JavaCompile) {
    source fileTree('src/main/java') { include '**/Cloud*.java' },
        'src/test/java/io/github/raymondnassar/recappage/prototype/CloudTest.java'
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir('cloud-tests')
    sourceCompatibility = '17'
    targetCompatibility = '17'
}
tasks.register('cloudTest', JavaExec) {
    dependsOn 'compileCloudTests'
    classpath = files(layout.buildDirectory.dir('cloud-tests'))
    mainClass = 'io.github.raymondnassar.recappage.prototype.CloudTest'
    // Smaller than a phone app's heap, so a create at the size cap meets the memory limit here as it can on
    // a device, where running out of memory on an uncaught path ends the whole app.
    maxHeapSize = '128m'
}
tasks.named('check').configure { dependsOn 'policyTest', 'cloudTest' }
