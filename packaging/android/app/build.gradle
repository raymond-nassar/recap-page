import groovy.json.JsonSlurper

plugins {
    id 'com.android.application'
}

abstract class PrepareAndroidAssets extends Exec {
    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()
}

abstract class PrepareAndroidIcon extends Copy {
    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()
}

def repositoryRoot = rootProject.projectDir.toPath().resolve('../..').normalize().toFile()
def metadata = new JsonSlurper().parse(new File(repositoryRoot, 'package.json'))
def betaRevision = 2

android {
    namespace 'io.github.raymondnassar.recappage.prototype'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.raymondnassar.recappage.prototype'
        minSdk 26
        targetSdk 36
        // Beta 1 shipped as 3000001. Keep Android updates monotonic independently of desktop versions.
        versionCode 3000000 + betaRevision
        versionName "${metadata.version}-beta.${betaRevision}"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug {
            debuggable true
        }
    }
    lint {
        abortOnError true
        warningsAsErrors true
        // The prototype deliberately pins the reviewed AGP/Gradle compatibility pair.
        disable 'AndroidGradlePluginVersion'
    }
}

dependencies {
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.7.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.4.0'
}

def prepareAssets = tasks.register('prepareAndroidAssets', PrepareAndroidAssets) {
    outputDirectory.set(layout.buildDirectory.dir('generated/assets'))
    workingDir repositoryRoot
    commandLine 'node', new File(repositoryRoot, 'scripts/prepare-android.mjs').absolutePath
    inputs.dir new File(repositoryRoot, 'src')
    inputs.dir new File(rootProject.projectDir, 'web')
    inputs.files new File(repositoryRoot, 'scripts/prepare-android.mjs'),
        new File(repositoryRoot, 'server.mjs'), new File(repositoryRoot, 'package.json')
}

def prepareIcon = tasks.register('prepareAndroidIcon', PrepareAndroidIcon) {
    outputDirectory.set(layout.buildDirectory.dir('generated/recap-res'))
    from new File(repositoryRoot, 'src/icons/icon-192.png')
    into outputDirectory.dir('drawable-nodpi')
    rename { 'recap_icon.png' }
}

androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    variant.sources.assets.addGeneratedSourceDirectory(prepareAssets) { it.outputDirectory }
    variant.sources.res.addGeneratedSourceDirectory(prepareIcon) { it.outputDirectory }
}

// No JUnit dependency is needed for the platform-independent navigation boundary.
tasks.register('compilePolicyTests', JavaCompile) {
    source 'src/main/java/io/github/raymondnassar/recappage/prototype/NavigationPolicy.java',
        'src/test/java/io/github/raymondnassar/recappage/prototype/NavigationPolicyTest.java'
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir('policy-tests')
    sourceCompatibility = '17'
    targetCompatibility = '17'
}
tasks.register('policyTest', JavaExec) {
    dependsOn 'compilePolicyTests'
    classpath = files(layout.buildDirectory.dir('policy-tests'))
    mainClass = 'io.github.raymondnassar.recappage.prototype.NavigationPolicyTest'
}
tasks.named('check').configure { dependsOn 'policyTest' }
