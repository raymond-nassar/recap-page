# blank_issues_enabled must stay true. The security policy tells a reporter who cannot use private
# vulnerability reporting to open an issue saying only that they have a security report and asking
# how to send it. Private reporting was enabled on 2026-08-16, so that fallback is now a spare
# rather than the live route, but it is still the route for anyone whose Security tab does not
# offer it. Turning blank issues off would leave that reporter with three public forms, each of
# which asks for detail and tells them not to paste anything private, and no way to ask for a
# channel. The forms below are a convenience; this line is a promise the security policy made.
blank_issues_enabled: true

contact_links:
  - name: Report a security problem
    url: https://github.com/raymond-nassar/recap-page/blob/main/SECURITY.md
    about: >-
      Never in a public issue. The policy explains how to report privately and what is in scope,
      including which parts of the app destroy data on purpose.
  - name: Ask for help rather than report a fault
    url: https://github.com/raymond-nassar/recap-page/blob/main/SUPPORT.md
    about: >-
      Sorts a problem with this app from a problem with Marvel's service, with the upstream comic
      database, or with the point the metadata stops. Two of those three have answers elsewhere.
  - name: Why this is a browser companion and not a reader
    url: https://github.com/raymond-nassar/recap-page/blob/main/docs/WHY_A_BROWSER_APP.md
    about: >-
      The app cannot show you the comics themselves, and the reasons are measured rather than
      assumed. Worth reading before asking for it.
  - name: What is already planned
    url: https://github.com/users/raymond-nassar/projects/1
    about: >-
      Active work is planned here and each item links to the Issue that owns its reasoning.
