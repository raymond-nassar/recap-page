version: 2

# The app ships zero runtime dependencies, so every package below is development tooling and
# reaches nobody who uses the app. That is the whole reason this file can afford to be quiet:
# npm and action updates affect lint/CI rather than browser runtime dependencies. The optional
# Android build toolchain is watched separately and must also pass its documented APK checks.
#
# The advisory threshold, decided here because a threshold that lives in someone's head is not
# one. GitHub's Dependabot security updates are enabled on this repository and open a pull
# request for any severity, which is the right setting when the whole graph is four declared
# packages and what they pull in: there is no volume to triage. What the threshold governs is
# how fast each one has to be taken.
#
#   critical or high  Merge before the next change to the default branch. These run against a
#                     maintainer's checkout and inside CI, which is where a compromised lint
#                     plugin would do its damage.
#   moderate or low   Take at the weekly cadence rather than interrupting work for it. Note
#                     that a security pull request arrives when the advisory does, not on the
#                     schedule below: the schedule paces version updates, and the cadence here
#                     is how quickly a person has to answer one.
#   any severity in a runtime dependency
#                     Treat as a product vulnerability under `SECURITY.md`, not as tooling.
#                     There are none, and `test/security-policy.test.js` fails if that changes,
#                     which is what makes the row above safe to write.
#
# `npm audit` reported 0 vulnerabilities over the 90 packages it counted when this was written,
# so none of the three rows is deferring a backlog that already exists.
#
# There is no `open-pull-requests-limit` here, and its absence is deliberate rather than an
# omission. It caps version updates only, security pull requests are exempt from it by
# documented design, and a group matching `*` leaves no ungrouped straggler for it to cap. A
# limit that can never bind is a setting a later reader has to reason about for nothing.

updates:
  # Grouped into a single pull request because every package in this ecosystem is dev tooling
  # with the same blast radius, and four separate pull requests a week for four packages is
  # the noise this item was raised to avoid. Weekly rather than daily for the same reason.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      dev-tooling:
        patterns:
          - "*"
      # A group covers version updates only unless it says so, so without this second rule an
      # advisory against two packages at once would open two pull requests and the grouping
      # above would be a promise the file does not keep in the one case that matters most.
      dev-tooling-security:
        applies-to: security-updates
        patterns:
          - "*"

  # The workflow pins actions to commit revisions, so this ecosystem is what moves them. A pin
  # cannot drift on its own, which is the point of it, and the cost is that nothing updates it
  # either. Dependabot raises a SHA-pinned action and rewrites the version comment beside it,
  # which is what keeps a deliberate pin from quietly becoming an abandoned one.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: gradle
    directory: /packaging/android
    schedule:
      interval: weekly
      day: monday
    groups:
      android-build:
        patterns:
          - "*"
      android-build-security:
        applies-to: security-updates
        patterns:
          - "*"
