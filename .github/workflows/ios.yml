name: iOS

on:
  # Every pull request, with no path filter. The iOS app bundles the shared web app, the Android
  # app's phone layer and the preparation script, so a change almost anywhere in the repository can
  # break it, and a filter would be a list of paths someone has to keep complete.
  pull_request:
  push:
    branches: [main]
  # The recovery path, as in CI: once this file is on main, a result for any ref can be asked for.
  workflow_dispatch:
    inputs:
      live_cors:
        description: Check whether the live metadata API permits the app origin
        required: false
        type: boolean
        default: false
      prove_journal_fault_disabled:
        description: Prove interrupted restore rejects a completed restore without the injected fault
        required: false
        type: boolean
        default: false

# The workflow only reads the repository. It signs nothing, uploads nothing to Apple and uses no
# secret: these are unsigned Simulator builds.
permissions:
  contents: read

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  newest:
    name: iOS app on the newest runtime
    runs-on: macos-26
    # The backstop for time outside any step. The steps below declare 137 minutes between them, and
    # as in CI the step deadline is the one that should fire, so an overrun reports failure on the
    # step that ran long rather than cancelled on the job.
    timeout-minutes: 140
    env:
      # Selected by path rather than by the image's default, which moves when the image does.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      SIMULATOR_NAME: iPhone 17 Pro Max
      SIMULATOR_RUNTIME: latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          # Nothing in this job pushes.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 4
        with:
          node-version: '24'

      - name: Show the toolchain
        timeout-minutes: 3
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          node --version

      # Preparation uses Node's standard library alone, so nothing is installed.
      - name: Prepare the bundled web app
        timeout-minutes: 3
        run: node scripts/prepare-ios.mjs

      # Cold-boot work overlapped testing in the failures diagnosed in #964.
      - name: Boot the Simulator before building
        timeout-minutes: 5
        run: |
          udid=$(xcrun simctl list devices available --json | node -e '
            const fs = require("node:fs");
            const { devices } = JSON.parse(fs.readFileSync(0, "utf8"));
            const runtimes = Object.keys(devices).filter((runtime) =>
              runtime.startsWith("com.apple.CoreSimulator.SimRuntime.iOS-") &&
              (process.env.SIMULATOR_RUNTIME === "latest" || runtime.endsWith("." + process.env.SIMULATOR_RUNTIME))
            ).sort((a, b) => a.localeCompare(b, "en", { numeric: true }));
            const device = devices[runtimes.at(-1)]?.find((entry) => entry.name === process.env.SIMULATOR_NAME);
            if (!device) throw new Error("Requested iOS Simulator is not available");
            process.stdout.write(device.udid);
          ')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "DESTINATION=platform=iOS Simulator,id=$udid" >> "$GITHUB_ENV"

      - name: Build the Release Simulator configuration
        timeout-minutes: 20
        run: >-
          xcodebuild build
          -project packaging/ios/RecapPage.xcodeproj -scheme RecapPage
          -configuration Release -destination "$DESTINATION"
          -derivedDataPath "$RUNNER_TEMP/ReleaseDerivedData"
          CODE_SIGNING_ALLOWED=NO &&
          node packaging/ios/check-release-surface.mjs "$RUNNER_TEMP/ReleaseDerivedData/Build/Products/Release-iphonesimulator/RecapPage.app"

      - name: Build for testing
        timeout-minutes: 20
        run: >-
          xcodebuild build-for-testing
          -project packaging/ios/RecapPage.xcodeproj -scheme RecapPage
          -destination "$DESTINATION" -derivedDataPath "$RUNNER_TEMP/DerivedData"
          CODE_SIGNING_ALLOWED=NO

      - name: Run the unit tests
        timeout-minutes: 12
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project packaging/ios/RecapPage.xcodeproj -scheme RecapPage \
            -destination "$DESTINATION" -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -only-testing:RecapPageTests \
            -resultBundlePath "$RUNNER_TEMP/RecapPage-newest-unit.xcresult" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/unit-test.log"

      - name: Run the UI tests
        timeout-minutes: 40
        run: |
          set -o pipefail
          infrastructure='failed to initialize for UI testing|Failed to get background assertion for target app|Timed out while launching application via Xcode'
          for attempt in 1 2; do
            log="$RUNNER_TEMP/ui-$attempt.log"
            if xcodebuild test-without-building \
                -project packaging/ios/RecapPage.xcodeproj -scheme RecapPage \
                -destination "$DESTINATION" -derivedDataPath "$RUNNER_TEMP/DerivedData" \
                -only-testing:RecapPageUITests \
                -resultBundlePath "$RUNNER_TEMP/RecapPage-newest-ui-$attempt.xcresult" \
                CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$log"; then
              exit 0
            else
              statuses=("${PIPESTATUS[@]}")
            fi
            if [ "${statuses[1]}" -ne 0 ]; then
              exit "${statuses[1]}"
            fi
            # A separate assertion failure must not be hidden by an infrastructure retry.
            if [ "$attempt" = 2 ] || ! grep -Eq "$infrastructure" "$log" ||
                grep -E ':[0-9]+(:[0-9]+)?: error:|XCTAssert.*failed|failed -' "$log" | grep -Ev "$infrastructure"; then
              exit 1
            fi
            echo "::warning::XCTest UI-test infrastructure failure on attempt $attempt; retrying the complete UI suite once on the same Simulator"
          done

      - name: Prove the interrupted-restore test rejects the done row
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.prove_journal_fault_disabled }}
        timeout-minutes: 10
        env:
          TEST_RUNNER_RECAP_IOS_DISABLE_FIFTH_JOURNAL_PUT: '1'
        run: |
          set +e
          set -o pipefail
          log="$RUNNER_TEMP/journal-fault-disabled.log"
          xcodebuild test-without-building \
            -project packaging/ios/RecapPage.xcodeproj -scheme RecapPage \
            -destination "$DESTINATION" -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/RecapPage-journal-fault-disabled.xcresult" \
            -only-testing:RecapPageUITests/LaunchUITests/testFifthJournalPutFailureOffersRecoveryAfterForcedTermination \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$log"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::The fault-disabled mutation unexpectedly passed."
            exit 1
          fi
          if ! grep -Fq 'RECAP_PROBE_RESULT journal-fault-after-kill ' "$log" ||
              ! grep -Fq '"stateTableRow":"done: / matching / any"' "$log" ||
              ! grep -Fq 'the fault-disabled mutation must reach the done row' "$log"; then
            echo "::error::The targeted test failed without recording the expected done row."
            exit 1
          fi
          echo 'Expected fault-disabled failure observed: the interrupted-restore test recorded the done row.'

      - name: Check live metadata CORS from the app origin
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_cors }}
        timeout-minutes: 10
        env:
          TEST_RUNNER_RECAP_RUN_LIVE_CORS: '1'
        run: |
          set +e
          set -o pipefail
          xcodebuild test-without-building \
            -project packaging/ios/RecapPage.xcodeproj -scheme RecapPage \
            -destination "$DESTINATION" -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/RecapPage-live-cors.xcresult" \
            -only-testing:RecapPageUITests/LaunchUITests/testManualLiveMetadataCorsFromTheAppOrigin \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/live-cors.log"
          status=$?
          set -e
          result=$(grep -h 'RECAP_PROBE_RESULT live-metadata-cors' "$RUNNER_TEMP/live-cors.log" | sed 's/^.*RECAP_PROBE_RESULT //' || true)
          {
            echo '### Live metadata CORS check'
            echo "xcodebuild exit code: $status"
            if [ -n "$result" ]; then
              echo "$result"
            else
              echo 'The selected CORS test returned no probe result.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if [ -z "$result" ]; then
            echo "::error::The selected CORS test returned no probe result."
            exit 1
          fi
          exit "$status"

      # The probes' measurements, where a reader of the run finds them without opening the bundle.
      - name: Summarize the probe results
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: |
          {
            echo '### Probe results on the newest runtime'
            echo '```'
            grep -h 'RECAP_PROBE_RESULT' "$RUNNER_TEMP/unit-test.log" "$RUNNER_TEMP"/ui-*.log | sed 's/^.*RECAP_PROBE_RESULT //' | sort -u || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the result bundle
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 5
        with:
          name: ios-results-newest-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/RecapPage-newest-*.xcresult
            ${{ runner.temp }}/unit-test.log
            ${{ runner.temp }}/ui-*.log
          if-no-files-found: warn

  ipad:
    name: iPad presentation on the newest runtime
    runs-on: macos-26
    # These steps declare 83 minutes; leave the deadline to the individual step that overruns.
    timeout-minutes: 86
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      SIMULATOR_RUNTIME: latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 4
        with:
          node-version: '24'

      - name: Show the toolchain
        timeout-minutes: 3
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          node --version

      - name: Prepare the bundled web app
        timeout-minutes: 3
        run: node scripts/prepare-ios.mjs

      - name: Start the 13-inch iPad Simulator boot
        timeout-minutes: 3
        run: |
          udid=$(xcrun simctl list devices available --json | node -e '
            const fs = require("node:fs");
            const { devices } = JSON.parse(fs.readFileSync(0, "utf8"));
            const runtimes = Object.keys(devices)
              .filter((runtime) => runtime.startsWith("com.apple.CoreSimulator.SimRuntime.iOS-"))
              .sort((a, b) => a.localeCompare(b, "en", { numeric: true }));
            const device = devices[runtimes.at(-1)]?.find((entry) => entry.name.startsWith("iPad Pro 13-inch"));
            if (!device) throw new Error("Requested 13-inch iPad Simulator is not available");
            process.stdout.write(device.udid);
          ')
          xcrun simctl boot "$udid" > "$RUNNER_TEMP/ipad-boot.log" 2>&1 &
          echo "IPAD_UDID=$udid" >> "$GITHUB_ENV"
          echo "IPAD_DESTINATION=platform=iOS Simulator,id=$udid" >> "$GITHUB_ENV"

      - name: Build for testing
        timeout-minutes: 20
        run: >-
          xcodebuild build-for-testing
          -project packaging/ios/RecapPage.xcodeproj -scheme RecapPage
          -destination "$IPAD_DESTINATION" -derivedDataPath "$RUNNER_TEMP/DerivedData"
          CODE_SIGNING_ALLOWED=NO

      - name: Wait for the 13-inch iPad Simulator after the build
        timeout-minutes: 5
        run: |
          if ! xcrun simctl bootstatus "$IPAD_UDID" -b; then
            cat "$RUNNER_TEMP/ipad-boot.log"
            exit 1
          fi

      - name: Run presentation UI tests on iPad
        timeout-minutes: 35
        run: |
          set -o pipefail
          infrastructure='failed to initialize for UI testing|Failed to get background assertion for target app|Timed out while launching application via Xcode'
          for attempt in 1 2; do
            log="$RUNNER_TEMP/ui-ipad-$attempt.log"
            if xcodebuild test-without-building \
                -project packaging/ios/RecapPage.xcodeproj -scheme RecapPage \
                -destination "$IPAD_DESTINATION" -derivedDataPath "$RUNNER_TEMP/DerivedData" \
                -only-testing:RecapPageUITests/PresentationUITests \
                -resultBundlePath "$RUNNER_TEMP/RecapPage-ipad-ui-$attempt.xcresult" \
                CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$log"; then
              exit 0
            else
              statuses=("${PIPESTATUS[@]}")
            fi
            if [ "${statuses[1]}" -ne 0 ]; then
              exit "${statuses[1]}"
            fi
            if [ "$attempt" = 2 ] || ! grep -Eq "$infrastructure" "$log" ||
                grep -E ':[0-9]+(:[0-9]+)?: error:|XCTAssert.*failed|failed -' "$log" | grep -Ev "$infrastructure"; then
              exit 1
            fi
            echo "::warning::XCTest iPad presentation infrastructure failure on attempt $attempt; retrying the presentation suite once on the same Simulator"
          done

      - name: Summarize the probe results
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: |
          {
            echo '### Presentation results on the 13-inch iPad'
            echo '```'
            grep -h 'RECAP_PROBE_RESULT' "$RUNNER_TEMP"/ui-ipad-*.log | sed 's/^.*RECAP_PROBE_RESULT //' | sort -u || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the result bundle
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 5
        with:
          name: ios-results-ipad-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/RecapPage-ipad-*.xcresult
            ${{ runner.temp }}/ui-ipad-*.log
          if-no-files-found: warn

  minimum:
    name: iOS app on the lowest iOS 18 runtime
    # The app supports iOS and iPadOS 18.0 and later. No image carries the 18.0 runtime, and this one
    # carries 18.5 beside Xcode 26, which every App Store build must use. Each job builds its own copy:
    # this one with Xcode 26.3 and the newest with 26.6, so only a 26.3 build is shown to run on iOS 18.
    runs-on: macos-15
    # Optional 375-point coverage adds 31 minutes; keep the job deadline outside its 106 step minutes.
    timeout-minutes: 110
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      SIMULATOR_NAME: iPhone 16e
      SIMULATOR_RUNTIME: iOS-18-5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          # Nothing in this job pushes.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 4
        with:
          node-version: '24'

      - name: Show the toolchain
        timeout-minutes: 3
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          node --version

      - name: Find the iPhone SE (3rd generation) Simulator
        id: iphone-se
        timeout-minutes: 3
        run: |
          udid=$(xcrun simctl list devices available --json | node -e '
            const fs = require("node:fs");
            const { devices } = JSON.parse(fs.readFileSync(0, "utf8"));
            const runtimes = Object.keys(devices)
              .filter((runtime) =>
                runtime.startsWith("com.apple.CoreSimulator.SimRuntime.iOS-") &&
                runtime.endsWith("." + process.env.SIMULATOR_RUNTIME)
              )
              .sort((a, b) => a.localeCompare(b, "en", { numeric: true }));
            const device = devices[runtimes.at(-1)]?.find((entry) => entry.name === "iPhone SE (3rd generation)");
            if (device) process.stdout.write(device.udid);
          ')
          if [ -z "$udid" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "IPHONE_375_AVAILABLE=false" >> "$GITHUB_ENV"
            echo "::notice::iPhone SE (3rd generation) is unavailable on the iOS 18 runtime; 375-point iPhones are untested."
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "IPHONE_375_UDID=$udid" >> "$GITHUB_ENV"
          echo "IPHONE_375_AVAILABLE=true" >> "$GITHUB_ENV"

      - name: Boot iPhone SE (3rd generation) Simulator
        if: steps.iphone-se.outputs.available == 'true'
        timeout-minutes: 3
        run: |
          xcrun simctl boot "$IPHONE_375_UDID" > "$RUNNER_TEMP/iphone-se-boot.log" 2>&1 &

      - name: Prepare the bundled web app
        timeout-minutes: 3
        run: node scripts/prepare-ios.mjs

      - name: Boot the Simulator before building
        timeout-minutes: 5
        run: |
          udid=$(xcrun simctl list devices available --json | node -e '
            const fs = require("node:fs");
            const { devices } = JSON.parse(fs.readFileSync(0, "utf8"));
            const runtimes = Object.keys(devices).filter((runtime) =>
              runtime.startsWith("com.apple.CoreSimulator.SimRuntime.iOS-") &&
              (process.env.SIMULATOR_RUNTIME === "latest" || runtime.endsWith("." + process.env.SIMULATOR_RUNTIME))
            ).sort((a, b) => a.localeCompare(b, "en", { numeric: true }));
            const device = devices[runtimes.at(-1)]?.find((entry) => entry.name === process.env.SIMULATOR_NAME);
            if (!device) throw new Error("Requested iOS Simulator is not available");
            process.stdout.write(device.udid);
          ')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "DESTINATION=platform=iOS Simulator,id=$udid" >> "$GITHUB_ENV"

      - name: Build for testing
        timeout-minutes: 20
        run: >-
          xcodebuild build-for-testing
          -project packaging/ios/RecapPage.xcodeproj -scheme RecapPage
          -destination "$DESTINATION" -derivedDataPath "$RUNNER_TEMP/DerivedData"
          CODE_SIGNING_ALLOWED=NO

      - name: Wait for the 375-point iPhone SE Simulator after the build
        if: steps.iphone-se.outputs.available == 'true'
        timeout-minutes: 5
        run: |
          if ! xcrun simctl bootstatus "$IPHONE_375_UDID" -b; then
            cat "$RUNNER_TEMP/iphone-se-boot.log"
            exit 1
          fi

      - name: Run the unit tests
        timeout-minutes: 12
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project packaging/ios/RecapPage.xcodeproj -scheme RecapPage \
            -destination "$DESTINATION" -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -only-testing:RecapPageTests \
            -resultBundlePath "$RUNNER_TEMP/RecapPage-minimum-unit.xcresult" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/unit-test.log"

      - name: Run the UI tests
        timeout-minutes: 18
        run: |
          set -o pipefail
          infrastructure='failed to initialize for UI testing|Failed to get background assertion for target app|Timed out while launching application via Xcode'
          for attempt in 1 2; do
            log="$RUNNER_TEMP/ui-$attempt.log"
            if xcodebuild test-without-building \
                -project packaging/ios/RecapPage.xcodeproj -scheme RecapPage \
                -destination "$DESTINATION" -derivedDataPath "$RUNNER_TEMP/DerivedData" \
                -only-testing:RecapPageUITests \
                -resultBundlePath "$RUNNER_TEMP/RecapPage-minimum-ui-$attempt.xcresult" \
                CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$log"; then
              exit 0
            else
              statuses=("${PIPESTATUS[@]}")
            fi
            if [ "${statuses[1]}" -ne 0 ]; then
              exit "${statuses[1]}"
            fi
            # A separate assertion failure must not be hidden by an infrastructure retry.
            if [ "$attempt" = 2 ] || ! grep -Eq "$infrastructure" "$log" ||
                grep -E ':[0-9]+(:[0-9]+)?: error:|XCTAssert.*failed|failed -' "$log" | grep -Ev "$infrastructure"; then
              exit 1
            fi
            echo "::warning::XCTest UI-test infrastructure failure on attempt $attempt; retrying the complete UI suite once on the same Simulator"
          done

      - name: Run presentation UI tests on iPhone SE (3rd generation)
        if: ${{ !cancelled() && steps.iphone-se.outputs.available == 'true' }}
        timeout-minutes: 20
        run: |
          set -o pipefail
          infrastructure='failed to initialize for UI testing|Failed to get background assertion for target app|Timed out while launching application via Xcode'
          for attempt in 1 2; do
            log="$RUNNER_TEMP/ui-iphone-se-$attempt.log"
            if xcodebuild test-without-building \
                -project packaging/ios/RecapPage.xcodeproj -scheme RecapPage \
                -destination "platform=iOS Simulator,id=$IPHONE_375_UDID" -derivedDataPath "$RUNNER_TEMP/DerivedData" \
                -only-testing:RecapPageUITests/PresentationUITests \
                -resultBundlePath "$RUNNER_TEMP/RecapPage-minimum-iphone-se-ui-$attempt.xcresult" \
                CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$log"; then
              echo "IPHONE_375_PRESENTATION_PASSED=true" >> "$GITHUB_ENV"
              exit 0
            else
              statuses=("${PIPESTATUS[@]}")
            fi
            if [ "${statuses[1]}" -ne 0 ]; then
              exit "${statuses[1]}"
            fi
            if [ "$attempt" = 2 ] || ! grep -Eq "$infrastructure" "$log" ||
                grep -E ':[0-9]+(:[0-9]+)?: error:|XCTAssert.*failed|failed -' "$log" | grep -Ev "$infrastructure"; then
              exit 1
            fi
            echo "::warning::XCTest 375-point iPhone presentation infrastructure failure on attempt $attempt; retrying the presentation suite once on the same Simulator"
          done

      - name: Summarize the probe results
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: |
          {
            echo '### Probe results on the lowest iOS 18 runtime'
            if [ "${IPHONE_375_PRESENTATION_PASSED:-false}" = true ]; then
              echo '375-point iPhone SE (3rd generation): presentation tests passed.'
            elif [ "${IPHONE_375_AVAILABLE:-false}" = true ]; then
              echo '375-point iPhone SE (3rd generation): available, but its presentation tests did not pass.'
            else
              echo '375-point iPhones are untested because iPhone SE (3rd generation) is unavailable on the iOS 18 runtime.'
            fi
            echo '```'
            grep -h 'RECAP_PROBE_RESULT' "$RUNNER_TEMP/unit-test.log" "$RUNNER_TEMP"/ui-*.log | sed 's/^.*RECAP_PROBE_RESULT //' | sort -u || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the result bundle
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 5
        with:
          name: ios-results-minimum-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/RecapPage-minimum-*.xcresult
            ${{ runner.temp }}/unit-test.log
            ${{ runner.temp }}/ui-*.log
          if-no-files-found: warn
