name: Pages home

on:
  push:
    branches: [main]
  workflow_dispatch:

# The source and artifact are checked by required Node jobs before merge. This workflow runs only
# from main so a pull request never receives Pages authority or publishes a preview.
permissions: {}

# Let the active production deployment finish. GitHub retains only the newest queued run, so an
# intermediate main push cannot overtake the latest reviewed commit.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages artifact
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the reviewed main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          persist-credentials: false

      - name: Use the maintained Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 4
        with:
          node-version: '24'

      - name: Verify the Pages contract
        timeout-minutes: 2
        run: node --test test/pages-home.test.js

      - name: Build the exact Pages artifact
        timeout-minutes: 2
        run: npm run pages:build

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        timeout-minutes: 4
        with:
          path: dist/pages
          retention-days: 1

  deploy:
    name: Deploy Pages home
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 11
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the reviewed artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        timeout-minutes: 10
