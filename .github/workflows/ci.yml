name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Both triggers above are tied to a repository event, so a commit can only ever
  # be tested at the moment it arrives. During the Actions incident of 2026-08-06
  # run creation stalled for hours: no run was ever created for the merge of #18,
  # and the run for the merge of #17 sat queued for over an hour before wedging in
  # a state that refused both cancel and rerun. That left main carrying three
  # merges with no run to re-run and no way to ask for one, because a commit that
  # never got a run has nothing to retry. This trigger is the recovery path, and
  # it is what makes a green result reachable for any ref on demand.
  workflow_dispatch:
    inputs:
      native_mode:
        description: Optional native checks; rehearsal uses this exact executing revision
        type: choice
        options: [none, debug, rehearsal]
        default: none
      android_emulator:
        description: Deprecated compatibility alias for native_mode debug; do not combine modes
        type: boolean
        required: false
        default: false
      android_rehearsal:
        description: Deprecated compatibility alias for native_mode rehearsal; requires the legacy source pin
        type: boolean
        required: false
        default: false
      android_rehearsal_source_sha:
        description: Deprecated exact source pin; only with android_rehearsal, never native_mode
        type: string
        required: false

# The workflow only ever reads the repository. Nothing here publishes or writes.
permissions:
  contents: read

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    # The outer backstop, not the mechanism. Every step below carries its own deadline
    # and they sum to 20 minutes, so this can only fire on time spent outside a step:
    # runner setup, post-run and cleanup, measured at 8 seconds at their worst. That
    # ordering is deliberate and a test pins it. See the note above the step deadlines.
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor declared in package.json engines. 24 is what the app is
        # developed against. Testing both is what stops the floor from rotting.
        node: ['20', '24']

    steps:
      # Deadlines are on the steps, and the reason is measured rather than stylistic.
      # A probe workflow run on 2026-08-11 put the same overrun under both placements:
      # a job-level `timeout-minutes` ended the job with conclusion `cancelled`, while
      # a step-level one ended it with `failure` and marked the overrunning step. This
      # repository already reads `cancelled` as "a newer push superseded it, nothing is
      # broken", because the concurrency group above makes that the common case, and
      # every red run during the Actions incident of 2026-08-06 was exactly that shape.
      # A deadline that reported `cancelled` would therefore be a real failure wearing
      # the one costume this project is trained to ignore. On the step it is a `failure`
      # that names which step ran long, and the log carries "has timed out after N
      # minutes", which is what separates it from a test or a gate that simply failed.
      #
      # The numbers are 241 CI runs, 676 successful jobs, worst completed time per step:
      # checkout 5s, setup-node 20s, install 8s, tests 6s, eslint 4s, each gate 1s.
      # On 2026-10-22, package installation exceeded the former four-minute deadline in all three jobs
      # without producing output. Ten minutes gives the install room to recover while
      # retaining a step-level deadline that reports a real overrun as failure.
      # Pinned to a full commit revision rather than a tag. A tag is a mutable pointer
      # the action's owner can move, so `@v7` is a promise to run whatever they publish
      # next, on a runner that holds a token. The revision below is the one reviewed.
      # It is deliberately the current major: a pinned revision never follows its tag,
      # so pinning v4 would have frozen its node20 runtime in place with nothing left
      # to move it. Checked before pinning: v4 and v7 declare an identical action.yml
      # apart from that runtime. Dependabot proposes the next revision and rewrites the
      # comment beside it, which is the update route and the reason for the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          # The publication allowance test verifies a historical draft ancestor.
          # A shallow checkout omits it and fails both Node jobs.
          fetch-depth: 0
          # Nothing in this job pushes, so the token has no work to do after checkout.
          # Left on, it is written into the git config and readable by every later step.
          persist-credentials: false

      # setup-node v7 drops only `always-auth` from v4's inputs, which this file never
      # used. The two it does use are unchanged.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The app itself still ships no runtime dependencies. The lockfile exists only
      # for the lint tooling, so this installs nothing that reaches the browser.
      # `--ignore-scripts` because a manifest is contributor-editable: an install
      # script is arbitrary code a pull request can add, running before any review
      # step. Measured: 0 of the 76 locked packages declare one, so this costs
      # nothing today and closes that boundary; npm audit is not a CI gate but can stall installs.
      # Three Node 20 installs and all three jobs on 2026-10-22 exceeded four minutes.
      # A subsequent main run completed in about two minutes. Ten minutes allows
      # recovery while retaining a step-level deadline that reports an overrun as failure.
      - name: Install
        timeout-minutes: 10
        run: npm ci --ignore-scripts --no-audit

      # `npm test` is deliberately `node --test` with no path argument. Node only
      # began expanding glob patterns after 20, so a quoted pattern would be read
      # as a literal filename on the floor version and find nothing. With no
      # argument Node applies its own discovery rules, which have been stable
      # since 20 and treat a directory named `test` as all-tests.
      #
      # `npm run contract` is deliberately absent. It calls the live metadata API,
      # so it would fail builds for reasons unrelated to the change under test, and
      # would put this repository's traffic on a third party's rate limit on every
      # push. It stays a manual pre-release check.
      - name: Run tests
        timeout-minutes: 4
        run: npm test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    # 31 minutes of step deadlines below, so the same ordering holds here.
    timeout-minutes: 32
    steps:
      # Full history is also needed by the test matrix's historical allowance proof.
      # The publication gate scans commit messages and every blob ever held.
      # A shallow fetch gives it one commit to look at; in that state it refuses to
      # answer rather than reporting a clean scan of almost nothing, so dropping this
      # setting turns the step red instead of leaving it green over a single commit.
      # A test pins the pairing, because this was the one decision in this file with
      # nothing but a comment behind it, and a comment is not a check.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          fetch-depth: 0
          # This job reads more history than any other and still never writes.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        timeout-minutes: 10
        run: npm ci --ignore-scripts --no-audit

      # Reports only. `npm run lint:fix` is the local counterpart; CI never rewrites
      # the tree, so formatting drift shows up as a failure rather than a surprise
      # commit.
      - name: Run ESLint
        timeout-minutes: 2
        run: npm run lint

      # Every `path:line` citation in every tracked file is fingerprinted by
      # the content of the lines it names, not by the numbers. A failure here means
      # the cited code moved or changed, so the claim written about it may no longer
      # be true.
      #
      # The fix is to re-read the cited lines and re-aim the anchor at whatever now
      # says what the claim says. `npm run anchors:bless` accepts the current state
      # wholesale, which is correct only once you have done that reading. Blessing
      # to clear a red build locks the wrong lines in permanently and silently,
      # which is the exact failure this gate exists to end.
      - name: Check evidence anchors
        timeout-minutes: 2
        run: npm run anchors

      # The anchors gate fingerprints the lines a citation names, so it reports a
      # sentence as sound however wrong the numbers in it have become. That is how one
      # figure here stayed wrong across twelve consecutive shipped items with every
      # gate green. This recomputes the figures that are derived from the ranked table
      # and fails with the derived value, which is the same argument for a machine
      # rather than a habit that produced the gate above it.
      - name: Check derived counts
        timeout-minutes: 2
        run: npm run counts

      # The gate above recomputes figures from the ranked table in the same document, so
      # it counts rows and never lines, and the anchors gate holds only what a citation
      # names. A sentence that states a file's size cites nothing and derives from no
      # table, which left it the one shape both were blind to, and it went stale twice:
      # once at 1,566 lines against a file that had reached 2,563, and again at 3,732
      # against 3,784. This recomputes each stated size from the tree.
      - name: Check stated file sizes
        timeout-minutes: 2
        run: npm run sizes

      # The interface used to carry dozens of one-off margin, padding and gap values. This gate
      # keeps those properties on the shared spacing ladder and rejects unclassified aliases.
      - name: Check spacing scale
        timeout-minutes: 2
        run: npm run spacing

      # The contrast ratios this stylesheet claims used to be prose in CSS comments,
      # and one of those comments warned in as many words that a second theme "would
      # void all of these and the measurement would have to be redone per theme".
      # That is now two palettes and dozens of pairs, which is past the point where a
      # comment written once and never re-measured is worth anything.
      #
      # This comment proved the point on itself. It used to state the pair count and
      # the recorded count as figures, and both had drifted from the gate by the time
      # anyone read them again, in a file no gate checks. The counts live in the gate's
      # own output now, which is re-measured on every run by construction.
      #
      # Some pairs are recorded as below the floor rather than fixed, and the gate is
      # exact in both directions: a new pair below the floor fails, and so does a
      # recorded pair that has since been raised. The second half is what stops the
      # recorded list from outliving the debt it describes. Each recorded pair prints
      # its current ratio here, so a number that drifts is visible rather than merely
      # counted.
      - name: Check palette contrast
        timeout-minutes: 2
        run: npm run palette

      # Two things a reader of a published repository would find, checked here because
      # both are decisions rather than code and a decision that is not checked stops
      # being one. The first is that the ignore rules keeping one session's working
      # notes local are still in force; the second is that nothing credential-shaped or
      # personal to one machine is committed anywhere in the history.
      #
      # It reads history reachable from the ref under test, which on a pull request is
      # the merge commit, so it covers both the branch and what it is merging into.
      # `npm run publication:surface` is the local counterpart and scans every branch
      # the remote advertises, which is what a clone would actually receive and is
      # therefore the population that matters on the day someone makes this public.
      #
      # Three minutes rather than the two its neighbours get. This is the one step whose
      # work grows with the history rather than with the tree, and it has only two runs
      # behind it, both at a second.
      - name: Check publication boundary
        timeout-minutes: 3
        run: npm run publication

  # #832 item 1 (UX-33). The browser owners ran only by hand, and `catalog-cards` failed on main
  # for over two weeks before anyone ran it (#828). These are the four the UI and UX audit named:
  # two desktop owners and two Android owners, each driving the Edge installed on the runner, so a
  # shared CSS change that breaks one of them fails here, before merge. The full suites still run by
  # hand, and the contributing guide says which owners a UI pull request must record.
  #
  # Windows because Edge is installed there, at the path the Android owners default to. The driver
  # is the one the Windows App Certification Kit workflow already pins, from its committed lock, and
  # it is installed outside the checkout, so package.json gains nothing.
  ui-owners:
    name: UI owners in Edge on Windows
    runs-on: windows-2022
    # The steps below declare 57 minutes between them, so this is the backstop for time outside any
    # step, in the same order the other jobs keep. Measured locally, no owner took over 35 seconds;
    # each step allows several times its owner, until this job has runs of its own to measure.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          # Nothing in this job pushes.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 4
        with:
          node-version: '24'

      # puppeteer-core from the lock that workflow uses, and axe-core at the exact version whose
      # file hash the harness pins. Both go outside the checkout with lifecycle scripts off, and the
      # harness refuses an axe file that does not match its pin rather than recording with it.
      - name: Install the browser driver and axe-core outside the checkout
        id: install
        timeout-minutes: 10
        shell: pwsh
        run: |
          $driver = Join-Path $env:RUNNER_TEMP 'recap-ui-owners-driver'
          Copy-Item -LiteralPath ./.github/browser-proof -Destination $driver -Recurse -ErrorAction Stop
          npm ci --prefix $driver --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'The browser driver could not be installed.' }
          $entry = Join-Path $driver 'node_modules\puppeteer-core\lib\puppeteer\puppeteer-core.js'
          if (-not (Test-Path -LiteralPath $entry -PathType Leaf)) { throw 'The browser driver entry file is missing.' }
          "MRT_PUPPETEER=$entry" >> $env:GITHUB_ENV
          $axe = Join-Path $env:RUNNER_TEMP 'recap-ui-owners-axe'
          New-Item -ItemType Directory -Force -Path $axe | Out-Null
          npm install --prefix $axe --ignore-scripts --no-audit --no-fund --save-exact axe-core@4.14.0
          if ($LASTEXITCODE -ne 0) { throw 'axe-core could not be installed.' }

      # One step per owner, so a failure names its owner, and each runs whether or not the one before
      # it passed, so one run reports every owner a change breaks.
      - name: Desktop owner responsive-reflow
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 4
        run: node scripts/browser-check.mjs --only=responsive-reflow

      - name: Desktop owner narrow-navigation
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 4
        run: node scripts/browser-check.mjs --only=narrow-navigation

      - name: Android owner catalog-cards
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 6
        run: node scripts/browser-android.mjs --only=catalog-cards

      # Against a baseline recorded from this same tree, so the owner's absolute checks of fit,
      # clipping, centering and focus decide the result and an intended move stays green. A baseline
      # from the base would fail every deliberate layout change by design and teach everyone to read
      # red as noise. The record further down compares with the base and lists every move instead.
      - name: Android owner alignment
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 6
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'recap-ui-owners-alignment'
          $env:MRT_ALIGNMENT_OUTPUT = Join-Path $evidence 'head-baseline'
          node scripts/browser-android.mjs --only=alignment --alignment-baseline
          if ($LASTEXITCODE -ne 0) { throw "The alignment baseline pass exited $LASTEXITCODE." }
          $env:MRT_ALIGNMENT_BASELINE = $env:MRT_ALIGNMENT_OUTPUT
          $env:MRT_ALIGNMENT_OUTPUT = Join-Path $evidence 'head-comparison'
          node scripts/browser-android.mjs --only=alignment
          if ($LASTEXITCODE -ne 0) { throw "The alignment comparison exited $LASTEXITCODE." }

      # #832 item 2 (UX-34). Records what axe finds, by route and theme, in this job's summary and its
      # evidence artifact. It never fails on a finding, only when it cannot produce the record.
      - name: Record the accessibility rules pass
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 6
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'recap-ui-owners-axe-evidence'
          $axe = Join-Path $env:RUNNER_TEMP 'recap-ui-owners-axe'
          node scripts/browser-check.mjs --axe "--axe-core=$axe" "--axe-out=$out"
          $code = $LASTEXITCODE
          $summary = Join-Path $out 'axe-summary.md'
          if (Test-Path -LiteralPath $summary) { Get-Content -LiteralPath $summary | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY }
          if ($code -ne 0) { throw "The rules pass could not record its evidence, exit code $code." }

      # Pull requests only, and never fatal. The base's own alignment pass records its baseline, the
      # head runs the owner against it, and every watched element that moved more than 1px is listed
      # with its delta in the summary and the artifact, for the author to explain. A failure here,
      # including a base whose harness no longer matches the head's, is reported rather than failed.
      - name: Check out the pull request's base for the alignment record
        if: ${{ !cancelled() && steps.install.outcome == 'success' && github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Record which watched elements moved against the base
        if: ${{ !cancelled() && steps.install.outcome == 'success' && github.event_name == 'pull_request' }}
        continue-on-error: true
        timeout-minutes: 8
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'recap-ui-owners-alignment'
          $record = Join-Path $evidence 'against-base'
          $baseline = Join-Path $evidence 'base-baseline'
          $baseLog = Join-Path $record 'base-baseline.log'
          $headLog = Join-Path $record 'head-against-base.log'
          New-Item -ItemType Directory -Force -Path $record | Out-Null
          $baseExit = 'skipped'
          if (Test-Path -LiteralPath 'base/scripts/browser-android.mjs') {
            Push-Location base
            $env:MRT_ALIGNMENT_OUTPUT = $baseline
            node scripts/browser-android.mjs --only=alignment --alignment-baseline *> $baseLog
            $baseExit = $LASTEXITCODE
            Pop-Location
          }
          $env:MRT_ALIGNMENT_BASELINE = $baseline
          $env:MRT_ALIGNMENT_OUTPUT = Join-Path $evidence 'head-against-base'
          node scripts/browser-android.mjs --only=alignment *> $headLog
          $headExit = $LASTEXITCODE
          $head = Join-Path $evidence 'head-baseline'
          node scripts/alignment-moves.mjs "--base=$baseline" "--head=$head" "--out=$record" "--base-sha=$env:BASE_SHA" "--base-exit=$baseExit" "--head-exit=$headExit" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          exit 0

      - name: Keep the evidence
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 3
        with:
          name: ui-owners-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/recap-ui-owners-alignment/
            ${{ runner.temp }}/recap-ui-owners-axe-evidence/

  android-emulator:
    name: Android emulator integration
    if: >-
      github.event_name == 'workflow_dispatch' &&
      ((inputs.native_mode != '' && inputs.native_mode != 'none') ||
      inputs.android_emulator == true || inputs.android_rehearsal == true ||
      inputs.android_rehearsal_source_sha != '')
    runs-on: ubuntu-24.04
    # The deadline gate counts both mutually exclusive execution paths.
    timeout-minutes: 100
    permissions:
      contents: read
      actions: read
    env:
      RECAP_ANDROID_MODE: Rehearsal
      RECAP_ANDROID_SOURCE_SHA: ${{ github.workflow_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 4
        with:
          node-version: '24'

      - name: Require one explicit native mode before preparing the host
        id: native_mode
        timeout-minutes: 2
        run: node scripts/android-candidate.mjs native-mode

      - name: Prepare the isolated emulator host
        timeout-minutes: 6
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libpulse0

      - name: Run full Android with synthetic data
        if: steps.native_mode.outputs.mode == 'debug'
        timeout-minutes: 25
        run: bash scripts/android-emulator-ci.sh

      - name: Run the shared secret-free AAB rehearsal
        if: steps.native_mode.outputs.mode == 'rehearsal'
        timeout-minutes: 50
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/android-release-candidate.sh rehearsal

      - name: Remove rehearsal signing scratch
        id: native_cleanup
        if: always() && steps.native_mode.outputs.mode == 'rehearsal'
        timeout-minutes: 3
        run: |
          bash scripts/android-release-candidate.sh cleanup
          capsule="$RUNNER_TEMP/recap-aab-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/android-native-failure.json"
          if [[ -f "$capsule" ]]; then
            node scripts/check-android-instrumentation.mjs --validate-native-failure >> "$GITHUB_OUTPUT"
          fi

      - name: Preserve native test evidence
        if: always() && steps.native_mode.outputs.mode == 'debug'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 3
        with:
          name: android-native-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            packaging/android/app/build/native-evidence/
            packaging/android/app/build/reports/lint-results-debug.*

      - name: Preserve only the verified rehearsal JSON
        if: success() && steps.native_mode.outputs.mode == 'rehearsal'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 3
        with:
          name: android-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/recap-aab-${{ github.run_id }}-${{ github.run_attempt }}/public/android-rehearsal.json

      - name: Preserve only validated nonpromotable native failure facts
        if: failure() && steps.native_mode.outputs.mode == 'rehearsal' && steps.native_cleanup.outputs.failure_capsule == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 1
        with:
          name: android-rehearsal-failure-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/recap-aab-${{ github.run_id }}-${{ github.run_attempt }}/android-native-failure.json
