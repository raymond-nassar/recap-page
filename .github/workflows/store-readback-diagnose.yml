name: Read-only Store readback diagnosis

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing public application release tag
        type: string
        required: true
      source_sha:
        description: Full immutable application release commit
        type: string
        required: true
      expected_pending_id:
        description: Exact pending submission to observe, never mutate
        type: string
        required: true
      expected_published_id:
        description: Exact expected current published submission
        type: string
        required: true
      bundle_sha256:
        description: Previously qualified bundle SHA-256 (not reverified by metadata reads)
        type: string
        required: true
      notes_sha256:
        description: SHA-256 of the approved release-note text in UTF-8
        type: string
        required: true
      read_uploaded_bundle:
        description: Attempt bounded GET-only proof of the current upload without retaining bytes
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: microsoft-store-production
  cancel-in-progress: false

jobs:
  diagnose:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: microsoft-store-production
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      EXPECTED_PENDING_ID: ${{ inputs.expected_pending_id }}
      EXPECTED_PUBLISHED_ID: ${{ inputs.expected_published_id }}
      BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
      NOTES_SHA256: ${{ inputs.notes_sha256 }}
      READ_UPLOADED_BUNDLE: ${{ inputs.read_uploaded_bundle }}
      TOOLING_SHA: ${{ github.workflow_sha }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      MICROSOFT_STORE_PRODUCT_ID: ${{ vars.MICROSOFT_STORE_PRODUCT_ID }}
      READBACK_SOURCE_DIRECTORY: release-source
    steps:
      - name: Check out reviewed diagnostic tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Check out immutable application source as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          ref: ${{ inputs.source_sha }}
          path: release-source
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 4
        with:
          node-version: '24'

      - name: Bind public release and approved notes without Store credentials
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          READBACK_RELEASE_FILE: ${{ runner.temp }}/readback-public-release.json
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]{1,5}\.[0-9]{1,5}\.[0-9]{1,5}$ ]]; then
            echo 'PUBLIC_RELEASE_TAG_INVALID'
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$READBACK_RELEASE_FILE"
          node scripts/diagnose-store-readback.mjs --preflight

      - name: Run synthetic read-only and publisher contract tests
        timeout-minutes: 2
        run: node --test test/store-readback.test.js test/store-upload-readback.test.js test/store-publisher.test.js test/microsoft-store-release.test.js

      - name: Observe exact Store submissions without mutation
        timeout-minutes: 10
        env:
          READBACK_RELEASE_FILE: ${{ runner.temp }}/readback-public-release.json
          PARTNER_CENTER_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
          PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
        run: node scripts/diagnose-store-readback.mjs --diagnose
