name: Read-only Store recovery inspection

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: microsoft-store-production
  cancel-in-progress: false

jobs:
  inspect:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: microsoft-store-production
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out reviewed inspection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 4
        with:
          node-version: '24'

      - name: Inspect without Store mutation
        timeout-minutes: 4
        env:
          PARTNER_CENTER_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
          PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
        run: node scripts/inspect-store-recovery.mjs
