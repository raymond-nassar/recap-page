name: 4.3.0 Store bundle handoff

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Explicitly approved immutable 4.3.0 release commit on main
        type: string
        required: true
      source_tree:
        description: Exact Git tree of that release commit
        type: string
        required: true
      workflow_sha:
        description: Separately reviewed immutable workflow revision (this dispatch revision)
        type: string
        required: true
      recipient:
        description: Intended recipient and purpose (no Store submission authorization)
        type: choice
        options: [repository-owner-partner-center]
        required: true
      build_approved:
        description: Owner separately approved this source, workflow and recipient for building
        type: boolean
        default: false
      transfer_approved:
        description: Owner separately approved one-day plaintext public Actions handoff to this recipient
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: microsoft-store-production
  cancel-in-progress: false

jobs:
  handoff:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.build_approved == true && inputs.transfer_approved == true
    environment: microsoft-store-production
    runs-on: windows-2022
    timeout-minutes: 150
    defaults:
      run:
        shell: pwsh
        working-directory: application
    env:
      WINAPP_CLI_TELEMETRY_OPTOUT: '1'
      HANDOFF_ROOT: ${{ github.workspace }}\recap-store-handoff-${{ github.run_id }}-${{ github.run_attempt }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      SOURCE_TREE: ${{ inputs.source_tree }}
      REVIEWED_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
      HANDOFF_RECIPIENT: ${{ inputs.recipient }}
      BUILD_APPROVED: ${{ inputs.build_approved }}
      TRANSFER_APPROVED: ${{ inputs.transfer_approved }}
    steps:
      - name: Check out reviewed tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          ref: ${{ github.workflow_sha }}
          path: tooling
          fetch-depth: 0
          persist-credentials: false

      - name: Check out selected release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          ref: ${{ inputs.source_sha }}
          path: application
          fetch-depth: 0
          persist-credentials: false

      - name: Set up build driver
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 4
        with:
          node-version: '24.20.0'

      - name: Bind selected source and reviewed workflow before execution
        id: binding
        timeout-minutes: 2
        run: |
          node ..\tooling\scripts\store-bundle-handoff.mjs bind
          if ($LASTEXITCODE -ne 0) { throw 'Source and approval binding failed.' }

      - name: Install inspection tooling privately
        timeout-minutes: 4
        run: |
          npm ci --ignore-scripts *> (Join-Path $env:HANDOFF_ROOT 'scratch\npm.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Inspection tooling installation failed.' }

      - name: Install checksum-verified WinApp CLI
        timeout-minutes: 6
        run: |
          $archive = Join-Path $env:HANDOFF_ROOT 'scratch\winappcli-x64-v0.6.0.zip'
          $toolRoot = Join-Path $env:HANDOFF_ROOT 'scratch\winappcli-x64-v0.6.0'
          Invoke-WebRequest `
            -Uri 'https://github.com/microsoft/winappCli/releases/download/v0.6.0/winappcli-x64.zip' `
            -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash
          if ($actual -ne 'F6DC42E3B4E4709C8F617003008E2CFDD9A51735E04E7170D60EDDA258DB78A8') {
            throw 'WinApp CLI v0.6.0 did not match its reviewed SHA-256.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $toolRoot
          $output = @(& (Join-Path $toolRoot 'winapp.exe') --version)
          if ($LASTEXITCODE -ne 0 -or $output.Count -eq 0 -or @('0.6.0', 'v0.6.0') -notcontains $output[-1].Trim()) {
            throw 'WinApp CLI version verification failed.'
          }
          $toolRoot >> $env:GITHUB_PATH

      - name: Build production native launchers privately
        timeout-minutes: 12
        run: |
          try {
            & .\scripts\build-native-launcher.ps1 *> (Join-Path $env:HANDOFF_ROOT 'scratch\native.txt')
            if (-not $?) { throw 'Native build failed.' }
          } catch { throw 'Production native build failed; private output is not exported.' }

      - name: Bind protected configuration and build once privately
        timeout-minutes: 15
        env:
          RECAP_ONEDRIVE_CLIENT_ID: ${{ secrets.RECAP_ONEDRIVE_CLIENT_ID }}
        run: |
          node ..\tooling\scripts\store-bundle-handoff.mjs configuration
          if ($LASTEXITCODE -ne 0) { throw 'Protected configuration expectation failed.' }
          node .\scripts\release-cloud-client.mjs windows-msix *> (Join-Path $env:HANDOFF_ROOT 'scratch\pack.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Configured Store packaging failed.' }

      - name: Remove protected configuration scratch
        if: always() && steps.binding.outcome == 'success'
        timeout-minutes: 2
        run: |
          node ..\tooling\scripts\release-cloud-client.mjs cleanup
          if ($LASTEXITCODE -ne 0) { throw 'Protected configuration cleanup failed.' }

      - name: Inspect exact packages and independently match protected configuration
        timeout-minutes: 12
        run: |
          npm run msix:inspect -- --structural 1> (Join-Path $env:HANDOFF_ROOT 'scratch\inspection.txt') 2> (Join-Path $env:HANDOFF_ROOT 'scratch\inspection-errors.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Package inspection failed; private output is not exported.' }
          node ..\tooling\scripts\store-bundle-handoff.mjs inspect
          if ($LASTEXITCODE -ne 0) { throw 'Inspection, protected configuration or pre-WACK hash differs.' }

      - name: Run existing WACK qualification privately
        timeout-minutes: 55
        run: |
          Remove-Item Env:\GITHUB_STEP_SUMMARY -ErrorAction Stop
          try {
            & .\scripts\run-wack.ps1 `
              -X64Package '.\dist\msix\RecapPage_4.3.0.0_x64.msix' `
              -Bundle '.\dist\msix\RecapPage_4.3.0.0_x64_arm64.msixbundle' `
              -Certificate '.\dist\msix\RecapPage-local-proof.cer' *> (Join-Path $env:HANDOFF_ROOT 'scratch\wack.txt')
            if (-not $?) { throw 'WACK failed.' }
          } catch { throw 'WACK execution or cleanup failed; private output is not exported.' }

      - name: Rebind and stage exact qualified bytes
        id: staged
        timeout-minutes: 3
        run: |
          node ..\tooling\scripts\store-bundle-handoff.mjs stage
          if ($LASTEXITCODE -ne 0) { throw 'Qualified handoff staging failed.' }

      - name: Remove all non-handoff material
        id: cleaned
        if: always()
        timeout-minutes: 5
        shell: powershell
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = 'Stop'
          $failures = @()
          try {
            $packages = @(Get-AppxPackage -Name PanelStackLabs.RecapPage |
              Where-Object PackageFamilyName -eq 'PanelStackLabs.RecapPage_we33aa8nvkpcc')
            foreach ($package in $packages) { Remove-AppxPackage -Package $package.PackageFullName }
            if (@(Get-AppxPackage -Name PanelStackLabs.RecapPage |
                Where-Object PackageFamilyName -eq 'PanelStackLabs.RecapPage_we33aa8nvkpcc').Count -ne 0) {
              throw 'WACK registration remains.'
            }
          } catch { $failures += 'Package cleanup failed.' }
          try {
            $cer = Join-Path $env:GITHUB_WORKSPACE 'application\dist\msix\RecapPage-local-proof.cer'
            if (Test-Path -LiteralPath $cer) {
              $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new($cer)
              try {
                $trusted = "Cert:\LocalMachine\TrustedPeople\$($certificate.Thumbprint)"
                if (Test-Path -LiteralPath $trusted) { Remove-Item -LiteralPath $trusted -Force }
                if (Test-Path -LiteralPath $trusted) { throw 'WACK trust remains.' }
              } finally { $certificate.Dispose() }
            }
          } catch { $failures += 'Certificate cleanup failed.' }
          foreach ($path in @(
            (Join-Path $env:GITHUB_WORKSPACE 'application\dist'),
            (Join-Path $env:GITHUB_WORKSPACE 'application\node_modules'),
            (Join-Path $env:RUNNER_TEMP "recap-native-build-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"),
            (Join-Path $env:HANDOFF_ROOT 'scratch')
          )) {
            try {
              if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Recurse -Force }
              if (Test-Path -LiteralPath $path) { throw 'Cleanup residue.' }
            } catch { $failures += 'Non-handoff cleanup failed.' }
          }
          if ($failures.Count -ne 0) { throw 'Non-handoff cleanup failed; transfer is forbidden.' }
          @("TEMP=$env:RUNNER_TEMP", "TMP=$env:RUNNER_TEMP") |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify final allowlist and qualified hashes after cleanup
        if: success() && steps.staged.outcome == 'success' && steps.cleaned.outcome == 'success'
        timeout-minutes: 2
        env:
          RECEIPT_SHA256: ${{ steps.staged.outputs.receipt_sha256 }}
        run: |
          node ..\tooling\scripts\store-bundle-handoff.mjs preflight
          if ($LASTEXITCODE -ne 0) { throw 'Final handoff preflight failed.' }

      - name: Upload one-day plaintext owner handoff
        if: success() && steps.staged.outcome == 'success' && steps.cleaned.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 2
        with:
          name: store-4.3.0-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.HANDOFF_ROOT }}\stage\RecapPage_4.3.0.0_x64_arm64.msixbundle
            ${{ env.HANDOFF_ROOT }}\stage\store-bundle-handoff.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Verify transferred staging remains qualified
        if: success() && steps.staged.outcome == 'success' && steps.cleaned.outcome == 'success'
        timeout-minutes: 2
        env:
          RECEIPT_SHA256: ${{ steps.staged.outputs.receipt_sha256 }}
        run: |
          node ..\tooling\scripts\store-bundle-handoff.mjs preflight
          if ($LASTEXITCODE -ne 0) { throw 'Handoff bytes changed during transfer; reject the artifact.' }

      - name: Remove final staging
        if: always()
        timeout-minutes: 2
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            if (Test-Path -LiteralPath $env:HANDOFF_ROOT) {
              Remove-Item -LiteralPath $env:HANDOFF_ROOT -Recurse -Force
            }
            if (Test-Path -LiteralPath $env:HANDOFF_ROOT) { throw 'Staging remains.' }
          } catch { throw 'Final handoff staging cleanup failed.' }
