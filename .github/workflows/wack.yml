name: Windows App Certification Kit

on:
  workflow_dispatch:
    inputs:
      release_preparation:
        description: Run release checks and retain only the portable ZIP and provenance
        type: boolean
        required: false
        default: false
      native_only:
        description: Build and prove only the native startup tools
        type: boolean
        required: false
        default: false
      diagnostic_only:
        description: Acquire the bounded x64 console and WACK diagnostic facts
        type: boolean
        required: false
        default: false
      diagnostic_target:
        description: Bounded diagnostic target when diagnostic_only is enabled
        type: choice
        options: [console-wack, handles, f01-smoke]
        required: false
        default: console-wack
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/wack.yml
      - .github/workflows/microsoft-store-release.yml
      - .github/browser-proof/**
      - LICENSE
      - package.json
      - packaging/windows/**
      - server.mjs
      - src/**
      - scripts/inspect-msix.mjs
      - scripts/build-native-launcher.ps1
      - scripts/lib/native-launcher.mjs
      - scripts/lib/startup-contract.mjs
      - scripts/msix-proof.mjs
      - scripts/native-startup-proof.ps1
      - scripts/pack-msix.mjs
      - scripts/pack-windows.mjs
      - scripts/run-wack.ps1
      - scripts/test-wack-report.ps1
      - scripts/wack-report.ps1
      - test/msix-packaging.test.js
      - test/microsoft-store-release.test.js
      - test/native/**
      - test/server-contract.test.js
      - test/startup-contract.test.js
      - test/wack-workflow.test.js

# WACK needs no repository write, package publication, identity token, or secret.
permissions:
  contents: read

env:
  WINAPP_CLI_TELEMETRY_OPTOUT: '1'

concurrency:
  group: wack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Build and prove the native startup boundary
    runs-on: windows-2022
    timeout-minutes: 181
    outputs:
      native_sha256: ${{ steps.build.outputs.native_sha256 }}
      proof_sha256: ${{ steps.build.outputs.proof_sha256 }}
    steps:
      - name: Reject conflicting manual diagnostic modes
        timeout-minutes: 2
        shell: pwsh
        env:
          NATIVE_ONLY: ${{ inputs.native_only }}
          DIAGNOSTIC_ONLY: ${{ inputs.diagnostic_only }}
          DIAGNOSTIC_TARGET: ${{ inputs.diagnostic_target }}
          RELEASE_PREPARATION: ${{ inputs.release_preparation }}
        run: |
          if ($env:RELEASE_PREPARATION -eq 'true' -and
              ($env:NATIVE_ONLY -eq 'true' -or $env:DIAGNOSTIC_ONLY -eq 'true')) {
            throw 'release_preparation requires the complete Windows proof.'
          }
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and
              $env:NATIVE_ONLY -eq 'true' -and $env:DIAGNOSTIC_ONLY -eq 'true') {
            throw 'native_only and diagnostic_only cannot both be enabled.'
          }
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and
              $env:DIAGNOSTIC_TARGET -in @('handles', 'f01-smoke') -and $env:DIAGNOSTIC_ONLY -ne 'true') {
            throw 'A focused target requires diagnostic_only.'
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 4
        with:
          node-version: '24'
          cache: npm
      - name: Install repository tooling
        timeout-minutes: 4
        run: npm ci --ignore-scripts
      - name: Build both native targets and isolated proof tools
        id: build
        timeout-minutes: 12
        shell: pwsh
        run: ./scripts/build-native-launcher.ps1 -IncludeProofTools
      - name: Prove startup negatives and reviewed placement
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.diagnostic_only == true) }}
        timeout-minutes: 12
        shell: pwsh
        run: ./scripts/native-startup-proof.ps1 -Negatives
      - name: Install the checksum-verified diagnostic package tool
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic_only == true && !(inputs.diagnostic_target == 'handles' || inputs.diagnostic_target == 'f01-smoke') }}
        timeout-minutes: 6
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'winappcli-x64-v0.6.0.zip'
          $toolRoot = Join-Path $env:RUNNER_TEMP 'winappcli-x64-v0.6.0'
          Invoke-WebRequest `
            -Uri 'https://github.com/microsoft/winappCli/releases/download/v0.6.0/winappcli-x64.zip' `
            -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash
          $expected = 'F6DC42E3B4E4709C8F617003008E2CFDD9A51735E04E7170D60EDDA258DB78A8'
          if ($actual -ne $expected) {
            throw 'WinApp CLI v0.6.0 did not match its reviewed SHA-256.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $toolRoot
          $version = @(& (Join-Path $toolRoot 'winapp.exe') --version)[-1].Trim()
          if (@('0.6.0', 'v0.6.0') -notcontains $version) {
            throw 'The diagnostic package tool did not report version 0.6.0.'
          }
          $toolRoot >> $env:GITHUB_PATH
      - name: Build one diagnostic package set
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic_only == true && !(inputs.diagnostic_target == 'handles' || inputs.diagnostic_target == 'f01-smoke') }}
        timeout-minutes: 15
        run: npm run msix:pack
      - name: Inspect the diagnostic package set
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic_only == true && !(inputs.diagnostic_target == 'handles' || inputs.diagnostic_target == 'f01-smoke') }}
        timeout-minutes: 8
        run: npm run msix:inspect -- --structural
      - name: Acquire both native and WACK diagnostic facts
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic_only == true && !(inputs.diagnostic_target == 'handles' || inputs.diagnostic_target == 'f01-smoke') }}
        timeout-minutes: 70
        shell: pwsh
        run: |
          $failures = @()
          try {
            ./scripts/native-startup-proof.ps1 -Diagnostic
          } catch {
            "Native diagnostic failed: type=$($_.Exception.GetType().Name); code=$($_.Exception.HResult)"
            $failures += [InvalidOperationException]::new(
              'Native diagnostic acquisition failed; consult the bounded diagnostic facts.'
            )
          }
          $version = (Get-Content -LiteralPath ./package.json -Raw | ConvertFrom-Json).version
          try {
            ./scripts/run-wack.ps1 `
              -X64Package "./dist/msix/RecapPage_${version}.0_x64.msix" `
              -Bundle "./dist/msix/RecapPage_${version}.0_x64_arm64.msixbundle" `
              -Certificate './dist/msix/RecapPage-local-proof.cer'
          } catch {
            "WACK diagnostic rejected or failed: type=$($_.Exception.GetType().Name); code=$($_.Exception.HResult)"
            $failures += [InvalidOperationException]::new(
              'WACK rejected or failed; consult the sanitized category facts when available.'
            )
          }
          if ($failures.Count -ne 0) {
            throw [AggregateException]::new('Diagnostic acquisition or certification failed.', [Exception[]]$failures)
          }
      - name: Acquire the focused handle diagnostic
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic_only == true && inputs.diagnostic_target == 'handles' }}
        timeout-minutes: 20
        shell: pwsh
        run: ./scripts/native-startup-proof.ps1 -Diagnostic -DiagnosticTarget handles
      - name: Run bounded F01 and wrapper smoke
        id: f01_smoke
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic_only == true && inputs.diagnostic_target == 'f01-smoke' }}
        timeout-minutes: 6
        shell: pwsh
        run: ./scripts/native-startup-proof.ps1 -Diagnostic -DiagnosticTarget f01-smoke
      - name: Retain the safe x64 pending preview
        if: ${{ always() && steps.f01_smoke.outputs.preview_ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 2
        with:
          name: native-preview-x64-${{ github.sha }}
          path: |
            dist/native-preview/x64/pending-dark.bmp
            dist/native-preview/x64/evidence.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Transfer only the native launchers and their provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 2
        with:
          name: native-launcher-${{ github.sha }}
          path: |
            dist/native-launcher/build.json
            dist/native-launcher/x64/RecapPageLauncher.exe
            dist/native-launcher/arm64/RecapPageLauncher.exe
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Transfer only the isolated proof tools and their provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 2
        with:
          name: native-proof-${{ github.sha }}
          path: |
            dist/native-proof/build.json
            dist/native-proof/x64/NativeStartupTests.exe
            dist/native-proof/arm64/NativeStartupTests.exe
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Remove native build outputs
        if: always()
        timeout-minutes: 5
        shell: powershell
        env:
          DIAGNOSTIC_ONLY: ${{ inputs.diagnostic_only }}
          DIAGNOSTIC_TARGET: ${{ inputs.diagnostic_target }}
        run: |
          $failures = @()
          $paths = @('./dist/native-launcher', './dist/native-proof', './dist/native-preview')
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and
              $env:DIAGNOSTIC_ONLY -eq 'true' -and $env:DIAGNOSTIC_TARGET -notin @('handles', 'f01-smoke')) {
            try {
              Get-AppxPackage -Name PanelStackLabs.RecapPage |
                Where-Object PackageFamilyName -eq 'PanelStackLabs.RecapPage_we33aa8nvkpcc' |
                ForEach-Object { Remove-AppxPackage -Package $_.PackageFullName -ErrorAction Stop }
              if (Get-AppxPackage -Name PanelStackLabs.RecapPage) {
                throw 'The diagnostic package remains registered.'
              }
            } catch { $failures += $_.Exception }
            try {
              $cer = './dist/msix/RecapPage-local-proof.cer'
              if (Test-Path -LiteralPath $cer) {
                $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
                  (Resolve-Path -LiteralPath $cer).Path
                )
                $trusted = "Cert:\LocalMachine\TrustedPeople\$($certificate.Thumbprint)"
                if (Test-Path -LiteralPath $trusted) {
                  Remove-Item -LiteralPath $trusted -ErrorAction Stop
                }
                if (Test-Path -LiteralPath $trusted) {
                  throw 'The diagnostic certificate remains trusted.'
                }
              }
            } catch { $failures += $_.Exception }
            $paths += @(
              './dist/msix', './dist/msix-proof',
              (Join-Path $env:RUNNER_TEMP 'winappcli-x64-v0.6.0.zip'),
              (Join-Path $env:RUNNER_TEMP 'winappcli-x64-v0.6.0')
            )
          }
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $env:DIAGNOSTIC_ONLY -eq 'true') {
            $paths += (Join-Path $env:RUNNER_TEMP "recap-native-negative-inputs-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT")
          }
          foreach ($path in $paths) {
            try {
              if (Test-Path -LiteralPath $path) {
                Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction Stop
              }
            } catch { $failures += $_.Exception }
          }
          if ($failures.Count -ne 0) {
            throw [AggregateException]::new('Native diagnostic cleanup failed.', [Exception[]]$failures)
          }

  certify:
    name: WACK on supported x64 Windows
    # Microsoft's current SDK requirements list Server 2022 for command-line tools.
    # The standard x64 runner is free for this public repository. Server 2025 is not
    # in that supported-host list, so windows-latest is deliberately not used.
    runs-on: windows-2022
    needs: native
    if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.native_only == true || inputs.diagnostic_only == true)) }}
    timeout-minutes: 110
    env:
      MRT_NATIVE_SHA256: ${{ needs.native.outputs.native_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 4
        with:
          node-version: '24'
          cache: npm

      - name: Install checksum-verified WinApp CLI
        timeout-minutes: 6
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'winappcli-x64-v0.6.0.zip'
          $toolRoot = Join-Path $env:RUNNER_TEMP 'winappcli-x64-v0.6.0'
          Invoke-WebRequest `
            -Uri 'https://github.com/microsoft/winappCli/releases/download/v0.6.0/winappcli-x64.zip' `
            -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash
          $expected = 'F6DC42E3B4E4709C8F617003008E2CFDD9A51735E04E7170D60EDDA258DB78A8'
          if ($actual -ne $expected) {
            throw 'WinApp CLI v0.6.0 did not match its reviewed SHA-256.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $toolRoot
          $version = @(& (Join-Path $toolRoot 'winapp.exe') --version)[-1].Trim()
          if (@('0.6.0', 'v0.6.0') -notcontains $version) {
            throw 'The checksum-verified WinApp CLI did not report version 0.6.0.'
          }
          $toolRoot >> $env:GITHUB_PATH

      - name: Install repository tooling
        timeout-minutes: 4
        run: npm ci --ignore-scripts

      - name: Receive the exact native producer output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        timeout-minutes: 2
        with:
          name: native-launcher-${{ github.sha }}
          path: dist/native-launcher
          digest-mismatch: error

      - name: Verify native source and output provenance
        timeout-minutes: 2
        run: node scripts/lib/native-launcher.mjs --verify

      - name: Prove packaging leaves tracked inputs unchanged
        timeout-minutes: 2
        shell: pwsh
        run: |
          git diff --exit-code -- `
            LICENSE `
            packaging/windows `
            scripts/pack-msix.mjs `
            scripts/pack-windows.mjs `
            server.mjs `
            src
          if ($LASTEXITCODE -ne 0) {
            throw 'Packaging inputs were dirty before the exact-head build.'
          }

      - name: Resolve current package paths
        id: package-paths
        timeout-minutes: 2
        shell: pwsh
        run: |
          $appVersion = (Get-Content -LiteralPath ./package.json -Raw |
            ConvertFrom-Json).version
          $storeVersion = "$appVersion.0"
          "x64=./dist/msix/RecapPage_${storeVersion}_x64.msix" >> $env:GITHUB_OUTPUT
          "bundle=./dist/msix/RecapPage_${storeVersion}_x64_arm64.msixbundle" >> $env:GITHUB_OUTPUT
          "certificate=./dist/msix/RecapPage-local-proof.cer" >> $env:GITHUB_OUTPUT

      - name: Run focused packaging and WACK tests
        timeout-minutes: 2
        run: node --test test/msix-packaging.test.js test/wack-workflow.test.js

      - name: Run WACK report parser fixtures
        timeout-minutes: 2
        shell: pwsh
        run: ./scripts/test-wack-report.ps1

      - name: Build ephemeral certification packages
        timeout-minutes: 15
        run: npm run msix:pack

      - name: Inspect every certification package without executing foreign runtimes
        timeout-minutes: 5
        run: npm run msix:inspect -- --structural

      - name: Run WACK without retaining raw reports
        timeout-minutes: 55
        shell: pwsh
        run: |
          ./scripts/run-wack.ps1 `
            -X64Package '${{ steps.package-paths.outputs.x64 }}' `
            -Bundle '${{ steps.package-paths.outputs.bundle }}' `
            -Certificate '${{ steps.package-paths.outputs.certificate }}'

      - name: Remove generated certification material
        if: always()
        timeout-minutes: 5
        shell: powershell
        run: |
          $failures = @()
          try {
            $packages = @(Get-AppxPackage -Name PanelStackLabs.RecapPage |
              Where-Object PackageFamilyName -eq `
                'PanelStackLabs.RecapPage_we33aa8nvkpcc')
            foreach ($package in $packages) {
              Remove-AppxPackage -Package $package.PackageFullName -ErrorAction Stop
            }
            if (Get-AppxPackage -Name PanelStackLabs.RecapPage) {
              throw 'The WACK package remains registered.'
            }
          } catch {
            $failures += $_.Exception
          }
          try {
            $cer = './dist/msix/RecapPage-local-proof.cer'
            if (Test-Path -LiteralPath $cer) {
              $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
                (Resolve-Path -LiteralPath $cer).Path
              )
              $trusted = "Cert:\LocalMachine\TrustedPeople\$($certificate.Thumbprint)"
              if (Test-Path -LiteralPath $trusted) {
                Remove-Item -LiteralPath $trusted -ErrorAction Stop
              }
              if (Test-Path -LiteralPath $trusted) {
                throw 'The temporary WACK certificate remains trusted.'
              }
            }
          } catch {
            $failures += $_.Exception
          }
          try {
            Get-ChildItem -Path $env:TEMP `
              -Filter 'recap-page-wack-*' `
              -ErrorAction SilentlyContinue |
              ForEach-Object {
                Remove-Item -LiteralPath $_.FullName -Recurse -Force -ErrorAction Stop
              }
          } catch {
            $failures += $_.Exception
          }
          foreach ($path in @(
            (Join-Path $env:RUNNER_TEMP 'winappcli-x64-v0.6.0.zip'),
            (Join-Path $env:RUNNER_TEMP 'winappcli-x64-v0.6.0'),
            './dist'
          )) {
            try {
              if (Test-Path -LiteralPath $path) {
                Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction Stop
              }
              if (Test-Path -LiteralPath $path) {
                throw "Generated WACK material remains at $path"
              }
            } catch {
              $failures += $_.Exception
            }
          }
          if ($failures.Count -ne 0) {
            throw [AggregateException]::new(
              'One or more WACK cleanup boundaries failed.',
              [Exception[]]$failures
            )
          }

  installed:
    name: Installed functionality on ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    needs: native
    if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.native_only == true || inputs.diagnostic_only == true)) }}
    timeout-minutes: 99
    env:
      MRT_NATIVE_SHA256: ${{ needs.native.outputs.native_sha256 }}
      MRT_NATIVE_PROOF_SHA256: ${{ needs.native.outputs.proof_sha256 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2022
            source: package
          - architecture: arm64
            runner: windows-11-arm
            source: bundle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 4
        with:
          node-version: '24'
          cache: npm

      - name: Install checksum-verified WinApp CLI
        timeout-minutes: 6
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'winappcli-x64-v0.6.0.zip'
          $toolRoot = Join-Path $env:RUNNER_TEMP 'winappcli-x64-v0.6.0'
          Invoke-WebRequest `
            -Uri 'https://github.com/microsoft/winappCli/releases/download/v0.6.0/winappcli-x64.zip' `
            -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash
          $expected = 'F6DC42E3B4E4709C8F617003008E2CFDD9A51735E04E7170D60EDDA258DB78A8'
          if ($actual -ne $expected) {
            throw 'WinApp CLI v0.6.0 did not match its reviewed SHA-256.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $toolRoot
          $version = @(& (Join-Path $toolRoot 'winapp.exe') --version)[-1].Trim()
          if (@('0.6.0', 'v0.6.0') -notcontains $version) {
            throw 'The checksum-verified WinApp CLI did not report version 0.6.0.'
          }
          $toolRoot >> $env:GITHUB_PATH

      - name: Install repository tooling
        timeout-minutes: 4
        run: npm ci --ignore-scripts

      - name: Receive the exact native producer output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        timeout-minutes: 2
        with:
          name: native-launcher-${{ github.sha }}
          path: dist/native-launcher
          digest-mismatch: error

      - name: Receive the exact isolated proof tools
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        timeout-minutes: 2
        with:
          name: native-proof-${{ github.sha }}
          path: dist/native-proof
          digest-mismatch: error

      - name: Install external browser driver
        timeout-minutes: 4
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'recap-page-puppeteer'
          Copy-Item -LiteralPath ./.github/browser-proof -Destination $root -Recurse
          npm ci --prefix $root --ignore-scripts
          if ($LASTEXITCODE -ne 0) {
            throw 'The external browser driver could not be installed.'
          }
          $entry = Join-Path $root 'node_modules\puppeteer-core\lib\puppeteer\puppeteer-core.js'
          if (-not (Test-Path -LiteralPath $entry)) {
            throw 'The external browser driver entry file is missing.'
          }
          "MRT_PUPPETEER=$entry" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build ephemeral packages
        timeout-minutes: 15
        run: npm run msix:pack

      - name: Inspect every installed-proof package without executing foreign runtimes
        timeout-minutes: 5
        run: npm run msix:inspect -- --structural

      - name: Exercise the matching native startup fixtures
        id: native_fixtures
        timeout-minutes: 18
        shell: pwsh
        run: ./scripts/native-startup-proof.ps1 -Architecture '${{ matrix.architecture }}'
      - name: Retain the safe native pending preview
        if: ${{ always() && steps.native_fixtures.outputs.preview_ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 2
        with:
          name: native-preview-${{ matrix.architecture }}-${{ github.sha }}
          path: |
            dist/native-preview/${{ matrix.architecture }}/pending-dark.bmp
            dist/native-preview/${{ matrix.architecture }}/evidence.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Trust exact ephemeral certificate
        timeout-minutes: 2
        shell: pwsh
        run: |
          $source = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
            (Resolve-Path -LiteralPath ./dist/msix/RecapPage-local-proof.cer).Path
          )
          "MRT_PROOF_THUMBPRINT=$($source.Thumbprint)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $certificate = Import-Certificate `
            -FilePath ./dist/msix/RecapPage-local-proof.cer `
            -CertStoreLocation Cert:\LocalMachine\TrustedPeople
          if ($certificate.Thumbprint -ne $source.Thumbprint) {
            throw 'The trusted proof certificate differs from the generated CER.'
          }

      - name: Exercise installed certification journey
        timeout-minutes: 25
        shell: pwsh
        run: |
          function New-JourneyOutput {
            [pscustomobject]@{
              Lines = 0; Bytes = 0; Exceeded = $false; FinalCount = 0
              FinalRecords = [Collections.Generic.List[string]]::new()
            }
          }
          function Write-JourneyProgress {
            param($State, [Parameter(ValueFromPipeline = $true)][string]$InputObject)
            process {
              $State.Lines = [Math]::Min(4097, $State.Lines + 1)
              $State.Bytes = [Math]::Min(1048577, $State.Bytes + [Text.Encoding]::UTF8.GetByteCount($InputObject) + 1)
              if ($InputObject.Length -gt 4096 -or $State.Lines -gt 4096 -or $State.Bytes -gt 1MB) {
                if (-not $State.Exceeded) { Write-Output 'DIAG installed-journey-output bound-exceeded=1' }
                $State.Exceeded = $true
              }
              if (-not $State.Exceeded) { Write-Output $InputObject }
              if ($InputObject -match '^(PASS|FAIL) installed-journey') {
                $State.FinalCount = [Math]::Min(3, $State.FinalCount + 1)
                if ($State.FinalRecords.Count -lt 2 -and $InputObject.Length -le 4096) {
                  $State.FinalRecords.Add($InputObject)
                }
              }
            }
          }
          function Assert-InstalledJourneyCompletion {
            param($State, [int]$ExitCode, [string]$Scenario, [string]$Architecture, [string]$Source)
            $expected = "PASS installed-journey scenario=$Scenario architecture=$Architecture source=$Source cleanup=complete"
            $complete = -not $State.Exceeded -and $State.FinalCount -eq 1 -and
              $State.FinalRecords.Count -eq 1 -and $State.FinalRecords[0] -ceq $expected
            if ($ExitCode -ne 0 -or -not $complete) {
              Write-Host "DIAG installed-journey-result exit_code=$ExitCode final_records=$($State.FinalCount) complete=$complete"
              throw 'The installed journey did not finish its expected cleanup.'
            }
          }
          $journey = New-JourneyOutput
          npm run msix:prove -- `
            --architecture=${{ matrix.architecture }} `
            --source=${{ matrix.source }} `
            --scenario=certification-functionality | Write-JourneyProgress -State $journey
          $journeyExit = $LASTEXITCODE
          Assert-InstalledJourneyCompletion $journey $journeyExit 'certification-functionality' '${{ matrix.architecture }}' '${{ matrix.source }}'
          $journey = New-JourneyOutput
          npm run msix:prove -- `
            --architecture=${{ matrix.architecture }} `
            --source=${{ matrix.source }} `
            --scenario=busy-port-refusal | Write-JourneyProgress -State $journey
          $journeyExit = $LASTEXITCODE
          Assert-InstalledJourneyCompletion $journey $journeyExit 'busy-port-refusal' '${{ matrix.architecture }}' '${{ matrix.source }}'
          if ('${{ matrix.architecture }}' -eq 'x64') {
            $journey = New-JourneyOutput
            npm run msix:prove -- --scenario=update-state-continuity | Write-JourneyProgress -State $journey
            $journeyExit = $LASTEXITCODE
            Assert-InstalledJourneyCompletion $journey $journeyExit 'update-state-continuity' 'x64' 'package'
          }

      - name: Remove installed proof material
        if: always()
        timeout-minutes: 5
        shell: powershell
        run: |
          $failures = @()
          try {
            $packages = @(Get-AppxPackage -Name PanelStackLabs.RecapPage |
              Where-Object PackageFamilyName -eq `
                'PanelStackLabs.RecapPage_we33aa8nvkpcc')
            foreach ($package in $packages) {
              Remove-AppxPackage -Package $package.PackageFullName -ErrorAction Stop
            }
            if (Get-AppxPackage -Name PanelStackLabs.RecapPage) {
              throw 'The proof package remains registered.'
            }
          } catch {
            $failures += $_.Exception
          }
          try {
            $thumbprint = $env:MRT_PROOF_THUMBPRINT
            $cer = './dist/msix/RecapPage-local-proof.cer'
            if (-not $thumbprint -and (Test-Path -LiteralPath $cer)) {
              $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
                (Resolve-Path -LiteralPath $cer).Path
              )
              $thumbprint = $certificate.Thumbprint
            }
            if ($thumbprint) {
              $trusted = "Cert:\LocalMachine\TrustedPeople\$thumbprint"
              if (Test-Path -LiteralPath $trusted) {
                Remove-Item -LiteralPath $trusted -ErrorAction Stop
              }
              if (Test-Path -LiteralPath $trusted) {
                throw 'The temporary proof certificate remains trusted.'
              }
            }
          } catch {
            $failures += $_.Exception
          }
          try {
            $paths = @(
              './dist',
              (Join-Path $env:RUNNER_TEMP 'recap-page-puppeteer'),
              (Join-Path $env:RUNNER_TEMP 'winappcli-x64-v0.6.0.zip'),
              (Join-Path $env:RUNNER_TEMP 'winappcli-x64-v0.6.0')
            )
            foreach ($path in $paths) {
              if (Test-Path -LiteralPath $path) {
                Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction Stop
              }
              if (Test-Path -LiteralPath $path) {
                throw "Proof material remains at $path"
              }
            }
          } catch {
            $failures += $_.Exception
          }
          if ($failures.Count -ne 0) {
            throw [AggregateException]::new(
              'One or more installed-proof cleanup boundaries failed.',
              [Exception[]]$failures
            )
          }

  preparation:
    name: Prepare the portable release candidate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_preparation == true && inputs.native_only != true && inputs.diagnostic_only != true }}
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Check out the exact candidate and upgrade history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up the build driver
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked repository tooling
        timeout-minutes: 4
        run: npm ci --ignore-scripts
      - name: Install the isolated locked browser driver
        timeout-minutes: 4
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'recap-release-puppeteer'
          Copy-Item -LiteralPath ./.github/browser-proof -Destination $root -Recurse -ErrorAction Stop
          npm ci --prefix $root --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'The release browser driver could not be installed.' }
          $entry = Join-Path $root 'node_modules\puppeteer-core\lib\puppeteer\puppeteer-core.js'
          if (-not (Test-Path -LiteralPath $entry -PathType Leaf)) { throw 'The release browser driver is missing.' }
          "MRT_PUPPETEER=$root" >> $env:GITHUB_ENV
      - name: Run ESLint
        timeout-minutes: 2
        run: npm run lint
      - name: Run the bare test suite
        timeout-minutes: 6
        run: npm test
      - name: Check counts
        timeout-minutes: 2
        run: npm run counts
      - name: Check sizes
        timeout-minutes: 2
        run: npm run sizes
      - name: Check anchors
        timeout-minutes: 2
        run: npm run anchors
      - name: Check spacing
        timeout-minutes: 2
        run: npm run spacing
      - name: Check palette
        timeout-minutes: 2
        run: npm run palette
      - name: Check publication
        timeout-minutes: 4
        run: npm run publication
      - name: Check the live metadata contract
        timeout-minutes: 5
        run: npm run contract
      - name: Run the full ordinary browser suite once
        timeout-minutes: 40
        run: npm run browser
      - name: Prove the historical upgrade once
        timeout-minutes: 5
        run: npm run upgrade
      - name: Check the maintained Store packet
        timeout-minutes: 2
        run: npm run store:check
      - name: Build only the portable ZIP
        timeout-minutes: 10
        run: npm run pack
      - name: Verify portable bytes and record candidate provenance
        timeout-minutes: 10
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'recap-release-preparation'
          New-Item -ItemType Directory -Path $root -ErrorAction Stop | Out-Null
          $verifier = Join-Path $root 'verify.mjs'
          @'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { readFile, readdir, writeFile } from 'node:fs/promises';
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';

          const digest = (bytes) => createHash('sha256').update(bytes).digest('hex');
          export function verifyPortableEntries(expected, actual) {
            assert.deepEqual([...actual.keys()].sort(), [...expected.keys()].sort(), 'portable entry allowlist differs');
            assert.deepEqual([...actual.keys()].filter((name) => /\.exe$/i.test(name)), ['runtime/node.exe']);
            for (const [name, bytes] of expected) {
              assert.ok(actual.get(name).equals(bytes), `portable bytes differ: ${name}`);
            }
          }
          export function verifyPortableNames(expected, names, payload) {
            assert.equal(new Set(names).size, names.length, 'duplicate ZIP entry');
            const files = [...expected.keys()].map((name) => `${payload}/${name}`).sort();
            const directories = new Set(files.flatMap((name) => {
              const parts = name.split('/');
              return parts.slice(0, -1).map((_, index) => parts.slice(0, index + 1).join('/') + '/');
            }));
            for (const name of names) {
              assert.ok(!name.includes('\\') && !name.split('/').includes('..'), 'unsafe ZIP entry');
              if (name.endsWith('/')) assert.ok(directories.has(name), 'unexpected ZIP directory');
            }
            assert.deepEqual(names.filter((name) => !name.endsWith('/')).sort(), files, 'ZIP entry allowlist differs');
          }
          export function candidateRecord(input) {
            assert.equal(input.repository, 'raymond-nassar/recap-page');
            assert.match(input.commit, /^[0-9a-f]{40}$/);
            assert.equal(input.commit, input.expectedCommit, 'candidate commit differs');
            assert.match(input.tree, /^[0-9a-f]{40}$/);
            assert.match(input.version, /^\d+\.\d+\.\d+$/);
            assert.equal(input.version, input.lockVersion, 'lock version differs');
            assert.equal(input.version, input.browserVersion, 'browser version differs');
            assert.match(input.runId, /^[1-9]\d*$/);
            assert.match(input.runAttempt, /^[1-9]\d*$/);
            assert.match(input.nodeVersion, /^v24\.\d+\.\d+$/);
            assert.equal(input.nodeArchitecture, 'win-x64');
            assert.match(input.nodeHash, /^[0-9a-f]{64}$/);
            assert.ok(Number.isSafeInteger(input.bytes) && input.bytes > 0);
            assert.match(input.sha256, /^[0-9a-f]{64}$/);
            return {
              schemaVersion: 1, repository: input.repository,
              commit: input.commit, tree: input.tree, applicationVersion: input.version,
              workflow: { runId: input.runId, runAttempt: input.runAttempt },
              archive: { file: 'marvel-reading-tracker-windows.zip', bytes: input.bytes, sha256: input.sha256 },
              bundledNode: { version: input.nodeVersion, architecture: input.nodeArchitecture, sha256: input.nodeHash },
              portableLauncher: 'Start on Windows.cmd',
            };
          }
          async function entries(root, prefix = '') {
            const result = new Map();
            for (const entry of await readdir(root, { withFileTypes: true })) {
              assert.ok(!entry.isSymbolicLink(), 'portable symlink is forbidden');
              const name = prefix ? `${prefix}/${entry.name}` : entry.name;
              const path = join(root, entry.name);
              if (entry.isDirectory()) {
                for (const pair of await entries(path, name)) result.set(...pair);
              } else {
                assert.ok(entry.isFile(), 'portable entry must be a file');
                result.set(name, await readFile(path));
              }
            }
            return result;
          }
          async function main() {
            const root = process.env.GITHUB_WORKSPACE;
            const scratch = join(process.env.RUNNER_TEMP, 'recap-release-preparation');
            const git = (...args) => execFileSync('git', args, { cwd: root, encoding: 'utf8' }).trim();
            const commit = git('rev-parse', 'HEAD');
            const tree = git('rev-parse', 'HEAD^{tree}');
            assert.equal(git('status', '--porcelain', '--untracked-files=no'), '', 'candidate is dirty');
            assert.equal(commit, process.env.GITHUB_SHA);
            const { NODE_VERSION, NODE_ARCH, appFiles, fetchRuntime, readMe, PAYLOAD_NAME } =
              await import(pathToFileURL(join(root, 'scripts', 'pack-windows.mjs')));
            const pkg = JSON.parse(await readFile(join(root, 'package.json'), 'utf8'));
            const lock = JSON.parse(await readFile(join(root, 'package-lock.json'), 'utf8'));
            assert.equal(lock.version, lock.packages[''].version);
            const { APP_VERSION } = await import(pathToFileURL(join(root, 'src', 'js', 'lib', 'version.js')));
            const archivePath = join(root, 'dist', 'marvel-reading-tracker-windows.zip');
            const archive = await readFile(archivePath);
            const reference = join(scratch, 'official.zip');
            await writeFile(reference, await fetchRuntime(NODE_ARCH));
            const literal = (value) => "'" + value.replaceAll("'", "''") + "'";
            const unpack = (file, destination) => {
              execFileSync('powershell.exe', ['-NoProfile', '-NonInteractive', '-Command',
                `$ErrorActionPreference = 'Stop'; Expand-Archive -LiteralPath ${literal(file)} -DestinationPath ${literal(destination)}`],
              { encoding: 'utf8', timeout: 120000 });
            };
            unpack(reference, join(scratch, 'official'));
            const official = join(scratch, 'official', `node-${NODE_VERSION}-${NODE_ARCH}`);
            const node = await readFile(join(official, 'node.exe'));
            const expected = new Map();
            for (const name of appFiles()) expected.set(name, await readFile(join(root, name)));
            expected.set('Read this first.txt', Buffer.from(readMe));
            expected.set('runtime/LICENSE-node.txt', await readFile(join(official, 'LICENSE')));
            expected.set('runtime/node.exe', node);
            const names = JSON.parse(execFileSync('powershell.exe', ['-NoProfile', '-NonInteractive', '-Command',
              `$ErrorActionPreference = 'Stop'; Add-Type -AssemblyName System.IO.Compression.FileSystem; `
              + `$zip = [IO.Compression.ZipFile]::OpenRead(${literal(archivePath)}); `
              + 'try { ConvertTo-Json -InputObject @($zip.Entries | ForEach-Object { $_.FullName }) -Compress } finally { $zip.Dispose() }'],
            { encoding: 'utf8', timeout: 120000 }));
            verifyPortableNames(expected, names, PAYLOAD_NAME);
            unpack(archivePath, join(scratch, 'portable'));
            const outer = await readdir(join(scratch, 'portable'));
            assert.deepEqual(outer, [PAYLOAD_NAME], 'portable root differs');
            verifyPortableEntries(expected, await entries(join(scratch, 'portable', PAYLOAD_NAME)));
            const record = candidateRecord({
              repository: process.env.GITHUB_REPOSITORY, commit, expectedCommit: process.env.GITHUB_SHA, tree,
              version: pkg.version, lockVersion: lock.version, browserVersion: APP_VERSION,
              runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT,
              nodeVersion: NODE_VERSION, nodeArchitecture: NODE_ARCH, nodeHash: digest(node),
              bytes: archive.length, sha256: digest(archive),
            });
            assert.equal(digest(await readFile(archivePath)), record.archive.sha256, 'ZIP changed during inspection');
            await writeFile(join(root, 'dist', 'release-preparation.json'), JSON.stringify(record, null, 2) + '\n');
            console.log(`PASS portable-candidate files=${expected.size} version=${record.applicationVersion} sha256=${record.archive.sha256}`);
          }
          await main();
          '@ | Set-Content -LiteralPath $verifier -Encoding utf8 -ErrorAction Stop
          node $verifier
          if ($LASTEXITCODE -ne 0) { throw 'Portable archive verification failed.' }
      - name: Retain only the portable candidate and provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 2
        with:
          name: portable-candidate-${{ github.sha }}
          path: |
            dist/marvel-reading-tracker-windows.zip
            dist/release-preparation.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Remove portable preparation material
        if: always()
        timeout-minutes: 5
        shell: pwsh
        run: |
          $failures = @()
          foreach ($path in @(
            (Join-Path $env:RUNNER_TEMP 'recap-release-puppeteer'),
            (Join-Path $env:RUNNER_TEMP 'recap-release-preparation'),
            (Join-Path $env:GITHUB_WORKSPACE 'dist')
          )) {
            try {
              if (Test-Path -LiteralPath $path) {
                Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction Stop
              }
              if (Test-Path -LiteralPath $path) { throw 'Portable preparation material remains.' }
            } catch { $failures += $_.Exception }
          }
          if ($failures.Count -ne 0) {
            throw [AggregateException]::new('Portable preparation cleanup failed.', [Exception[]]$failures)
          }
