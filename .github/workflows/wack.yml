name: Windows App Certification Kit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/wack.yml

permissions: {}

concurrency:
  group: wack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Probe supported WACK host
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Measure supported host and WACK
        timeout-minutes: 3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sessionId = [System.Diagnostics.Process]::GetCurrentProcess().SessionId
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          $isAdmin = $principal.IsInRole(
            [Security.Principal.WindowsBuiltInRole]::Administrator
          )
          $os = Get-CimInstance Win32_OperatingSystem

          "Runner image: $env:ImageOS $env:ImageVersion"
          "Runner OS: $($os.Caption) $($os.Version)"
          "Runner architecture: $env:PROCESSOR_ARCHITECTURE"
          "PowerShell process session: $sessionId"
          "Administrator token: $isAdmin"

          $appcert = Join-Path ${env:ProgramFiles(x86)} `
            'Windows Kits\10\App Certification Kit\appcert.exe'
          if (-not (Test-Path -LiteralPath $appcert)) {
            throw 'The supported x64 host does not provide appcert.exe.'
          }
          $signature = Get-AuthenticodeSignature -FilePath $appcert
          $signedByMicrosoft = $signature.SignerCertificate.Subject `
            -match '(^|, )O=Microsoft Corporation(,|$)'
          if ($signature.Status -ne 'Valid' -or -not $signedByMicrosoft) {
            throw 'appcert.exe is not validly signed by Microsoft Corporation.'
          }
          $version = (Get-Item -LiteralPath $appcert).VersionInfo.FileVersion
          "Preinstalled appcert.exe: yes, version $version"
          "appcert.exe signature: $($signature.Status), Microsoft Corporation"
