name: Published branch population

on:
  workflow_dispatch:
  # Weekly notice is enough for repository housekeeping. Minute 17 avoids the start-of-hour
  # congestion GitHub documents for scheduled workflows.
  schedule:
    - cron: '17 13 * * 1'

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: Check advertised branches
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 4
        with:
          node-version: '24'

      - name: Check the published branch population
        timeout-minutes: 2
        run: npm run publication:branches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
